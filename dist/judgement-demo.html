<!DOCTYPE html>
<html lang="en" data-theme="mid" data-cards="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230E0B16%27/%3E%3Ctext x=%2716%27 y=%2724%27 font-size=%2722%27 text-anchor=%27middle%27 fill=%27%23F2B632%27%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<title>Judgement</title>
<style>
:root{--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
[data-theme=mid]{--bg:#0E0B16;--panel:#1C1730;--line:#3A2F58;--tx:#F4EFE3;--mut:#A49FB3;--ac:#F2B632;--btx:#0E0B16;--pill:#2A2140;--hot:#E5484D;--won:rgba(242,182,50,.22)}
[data-theme=ivo]{--bg:#F7F1E3;--panel:#FFFFFF;--line:#D9CDB0;--tx:#1F1B14;--mut:#7A7366;--ac:#B8892B;--btx:#FFFFFF;--pill:#EADFC5;--hot:#C0392B;--won:rgba(184,137,43,.24)}
[data-theme=felt]{--bg:#0F3B2B;--panel:#0B2E21;--line:#2B7357;--tx:#F4EFE3;--mut:#9CC4B2;--ac:#F2D06B;--btx:#0F3B2B;--pill:#175640;--hot:#E8574F;--won:rgba(242,208,107,.2)}
[data-theme=ruby]{--bg:#2A0A14;--panel:#220811;--line:#6B2338;--tx:#FBEFE6;--mut:#C79AA3;--ac:#FF7A8A;--btx:#2A0A14;--pill:#4A1424;--hot:#FF5A6E;--won:rgba(255,122,138,.22)}
[data-cards=white]{--cbg:#FBF8F0;--cink:#1B1B1B;--cred:#C0392B;--cbd:#CFC7B4}
[data-cards=black]{--cbg:#17151C;--cink:#F1ECE0;--cred:#FF6B6B;--cbd:#4A4458}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;--cs:min(1rem,18px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ac);border-radius:12px;padding:.5rem .9rem}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--ac);color:var(--btx);border-color:var(--ac);font-weight:700}
input[type=text],input:not([type]){width:100%;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;outline:none}
input:focus{border-color:var(--ac)}
#app{max-width:560px;margin:0 auto;padding:.3rem .9rem .7rem;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app.game{height:calc(100vh - var(--demo,0px));height:calc(100dvh - var(--demo,0px));height:calc(var(--appH,100dvh) - var(--demo,0px));min-height:0;overflow:hidden}
.gmain{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;overscroll-behavior:contain}
.gmain>*{flex-shrink:0}
.gmain>.table{flex:1 1 0;min-height:6.5rem}
@media (max-height:739px){
  #app.game{padding-top:.15rem}
  #app.game .ver{padding:0 0 calc(var(--cs)*.15)}
  #app.game .top{min-height:calc(var(--cs)*2.3);margin-bottom:0}
  #app.game .gchips{margin:calc(var(--cs)*.1) 0 calc(var(--cs)*.3);min-height:calc(var(--cs)*2.3)}
  #app.game .gc{padding:calc(var(--cs)*.25) calc(var(--cs)*.6)}
  #app.game .chatbar{min-height:calc(var(--cs)*2.1);margin-bottom:calc(var(--cs)*.3)}
  #app.game .banner{padding:.32rem .7rem;margin-bottom:.3rem}
  #app.game .seats{gap:.25rem;margin-bottom:.3rem}
  #app.game .hand{padding-top:1.2rem}
  #app.game .act{padding-top:.35rem}
}
#app.game>.act,#app.game>.hand{flex:none}
.gmain>.table.calling{min-height:4.4rem}
.ver{text-align:center;font-size:calc(var(--cs)*.66);color:var(--mut);letter-spacing:.06em;padding:calc(var(--cs)*.05) 0 calc(var(--cs)*.3)}
.top{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--cs)*.5);min-height:calc(var(--cs)*2.6);margin-bottom:calc(var(--cs)*.15)}
.ib{padding:calc(var(--cs)*.38) calc(var(--cs)*.85);font-size:calc(var(--cs)*.85);border-radius:20px}
.pillb{display:flex;align-items:center;gap:calc(var(--cs)*.45);background:var(--pill);border:1px solid var(--line);border-radius:22px;padding:calc(var(--cs)*.2) calc(var(--cs)*.65) calc(var(--cs)*.2) calc(var(--cs)*.25);font-size:calc(var(--cs)*.88);color:var(--tx);max-width:46%}
.pillb .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pillb .gear{color:var(--ac);font-size:calc(var(--cs)*1.05);line-height:1}
.cd{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:#3ecf8e;margin-left:.5rem;vertical-align:.08em}
.cd.wait{background:#f2b632}.cd.off{background:#e5484d}
.chatform input,#cin{font-size:max(16px,1rem)}
.bigcode{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.3em;text-indent:.3em;color:var(--ac);font-size:min(2.8rem,15vw);line-height:1.1;margin-top:.35rem;cursor:pointer}
.codechip{font-family:ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--ac);font-weight:700;font-size:calc(var(--cs)*.95);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:calc(var(--cs)*.35) calc(var(--cs)*.6) calc(var(--cs)*.35) calc(var(--cs)*.8)}
.serif{font-family:var(--serif)}
.av{width:1.7rem;height:1.7rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;background:var(--ac);color:var(--btx);flex:none}
.av.bot{background:transparent;border:1px dashed var(--mut);color:var(--mut);font-size:.5rem}
/* cards */
.card{position:relative;flex:none;background:var(--cbg);color:var(--cink);border:1px solid var(--cbd);border-radius:9px;font-family:var(--serif);display:inline-flex;align-items:center;justify-content:center;padding:0;user-select:none;-webkit-user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.card.red{color:var(--cred)}
.card .ix{position:absolute;top:4px;left:5px;line-height:1.02;font-weight:700;text-align:center;letter-spacing:-.02em}
.card .ix.br{top:auto;left:auto;bottom:4px;right:5px;transform:rotate(180deg)}
/* home */
.hero{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-start;padding:.4rem 0;margin-top:clamp(.4rem,3.5vh,2.4rem)}
.fan{position:relative;margin:0 auto}
.fan .pc{position:absolute;left:112px;bottom:0;transform-origin:50% 150%;animation:deal .7s both}
@keyframes deal{from{opacity:0;transform:translate(0,-60px) rotate(0) scale(.6)}to{opacity:1}}
.title{font-family:var(--serif);font-size:min(4.6rem,18.5vw);font-weight:500;line-height:1;color:var(--ac);text-align:center;margin:.1rem 0 0}
.words{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin:.7rem 0 .9rem}
.w{font-family:var(--serif);font-style:italic;font-size:1.35rem;padding:.25rem 1rem;border-radius:20px;background:var(--pill);animation:pop .6s both}
.w1{animation-delay:.9s}.w2{animation-delay:1.1s}.w3{animation-delay:1.3s;background:var(--ac);color:var(--btx);font-style:normal;font-weight:700;font-size:1.4rem}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.7)}70%{transform:translateY(-3px) scale(1.08)}100%{opacity:1;transform:none}}
.home{margin-top:auto;padding-top:.8rem;padding-bottom:clamp(1rem,6vh,4.2rem)}
.home input{font-size:1.2rem;padding:.9rem 1rem}
.home .row2 button{font-size:1.2rem;padding:.7rem 1.3rem;white-space:nowrap}
@media (max-height:720px){.home input{padding:.65rem .9rem}.big{padding:.75rem}.or{margin:.55rem 0 .4rem}.home .row2 button{padding:.5rem 1.1rem}.err{min-height:.8rem;margin:.1rem 0}.words{margin:.5rem 0 .6rem}.home{padding-bottom:.8rem}}
.err{min-height:1.1rem;font-size:.82rem;color:var(--hot);margin:.2rem 0 .3rem}
.row2{display:flex;gap:.5rem}
.or{text-align:center;font-size:.82rem;color:var(--mut);letter-spacing:.12em;margin:.9rem 0 .5rem}
.big{width:100%;font-size:1.4rem;padding:1rem}
/* lobby */
.lab{font-size:.68rem;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.seatrow{display:flex;align-items:center;gap:.6rem;background:var(--pill);border-radius:12px;padding:.6rem .7rem;margin-bottom:.4rem}
.tag{font-size:.65rem;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.sm{padding:.2rem .65rem;font-size:.78rem;border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.1rem 0}
.chip{padding:.38rem .85rem;border-radius:20px;font-size:.85rem;color:var(--tx)}
.chip.on{background:var(--ac);color:var(--btx);border-color:var(--ac);font-weight:700}
.info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem;text-align:center;font-size:.8rem;color:var(--mut)}
/* game */
.gchips{display:flex;align-items:center;gap:calc(var(--cs)*.4);margin:calc(var(--cs)*.15) 0 calc(var(--cs)*.4);min-height:calc(var(--cs)*2.75)}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:calc(var(--cs)*.35) calc(var(--cs)*.6);font-size:calc(var(--cs)*.8);white-space:nowrap;color:var(--tx)}
.gc b{color:var(--ac);font-family:var(--serif);font-size:calc(var(--cs)*.95)}
.gc b.rd{color:var(--hot)}
button.gc{color:var(--ac)}
.ring{margin-left:auto;position:relative;width:calc(var(--cs)*2.75);height:calc(var(--cs)*2.75);flex:none}
.ring svg{width:100%;height:100%}
.ring .rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.72);font-weight:700;font-variant-numeric:tabular-nums}
.chatbar{width:100%;display:flex;align-items:center;gap:calc(var(--cs)*.5);background:var(--pill);border:1px solid var(--line);border-radius:20px;min-height:calc(var(--cs)*2.4);padding:calc(var(--cs)*.2) calc(var(--cs)*.4) calc(var(--cs)*.2) calc(var(--cs)*.8);font-size:calc(var(--cs)*.82);color:var(--tx);margin-bottom:calc(var(--cs)*.45);text-align:left}
.chatbar .cb{color:var(--ac);font-weight:700;flex:none}
.chatbar .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatbar .ct.sys,.chatbar .ct.none{color:var(--mut);font-style:italic}
.badge{background:var(--ac);color:var(--btx);border-radius:12px;min-width:calc(var(--cs)*1.45);height:calc(var(--cs)*1.45);padding:0 calc(var(--cs)*.35);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--cs)*.7);flex:none}
.zone{position:relative}
.zone.open{min-height:15.5rem}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.5rem .8rem;display:flex;align-items:baseline;justify-content:space-between;gap:.1rem .7rem;flex-wrap:wrap;margin-bottom:.45rem}
.banner.mine{background:var(--ac);border-color:var(--ac);color:var(--btx)}
.banner b{font-size:1rem}
.banner .sy{font-family:var(--serif);font-size:1.25rem;font-weight:700}
.banner .sub{font-size:.74rem;opacity:.85}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-bottom:.5rem}
.seat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:.4rem .6rem;font-size:.82rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.1rem .4rem;min-width:0}
.seats.cmp .seat{flex-wrap:nowrap;padding:.2rem .5rem;font-size:.8rem;gap:.35rem}
.seats.cmp .seat .nm{flex:1 1 0}
.seats.cmp .st{font-size:.8rem;color:var(--tx)}
.legend{grid-column:1/-1;text-align:right;font-size:.6rem;letter-spacing:.06em;color:var(--mut);line-height:1;margin:0 .2rem -.05rem}
.ord{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.05rem;height:1.05rem;border-radius:50%;border:1px solid var(--line);color:var(--mut);font-size:.62rem;font-weight:700;line-height:1;margin-right:.1rem}
.ord.f{background:var(--ac);border-color:var(--ac);color:var(--btx)}
.ord.l{border-color:var(--ac);color:var(--ac)}
.seat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 4rem}
.seat .st{margin-left:auto}
.seat.me .nm{color:var(--ac);font-weight:600}
.seat.turn{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.seat.off .nm{opacity:.5}
.seat .st{font-size:.68rem;color:var(--mut);white-space:nowrap}
.seat .st b{color:var(--tx);font-size:.8rem}
.table{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.5rem .3rem .5rem;margin-bottom:.4rem;display:flex;align-items:center;justify-content:center}
.table.calling{padding:.7rem}
.tlab{position:absolute;bottom:.4rem;left:0;right:0;text-align:center;font-size:.66rem;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.slots{display:flex;flex-wrap:wrap;gap:1.4rem 4px;justify-content:center;align-items:flex-start;margin:0 auto}
.slot{position:relative;text-align:center;font-size:.7rem;color:var(--mut)}
.slot .sn{margin-top:.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.win .card{outline:3px solid var(--ac);outline-offset:2px}
.slot.win .sn{color:var(--ac);font-weight:700}
.empty{border:2px dashed var(--line);border-radius:9px}
.empty.turn{border-color:var(--ac)}
.rib{position:absolute;top:-1.1rem;left:50%;transform:translateX(-50%);font-size:.58rem;font-weight:800;padding:.08rem .4rem;border-radius:8px;letter-spacing:.05em;white-space:nowrap;z-index:2}
.rib.l{background:var(--ac);color:var(--btx)}
.rib.c{background:var(--hot);color:#fff}
.callinfo{text-align:center}
.callinfo .ci1{font-family:var(--serif);font-size:1.6rem;color:var(--ac)}
.callinfo .ci2{font-size:.8rem;color:var(--mut);margin-top:.2rem}
.hand{display:flex;justify-content:center;align-items:flex-start;padding-top:1.4rem;min-height:1rem}
.hand .card{transition:transform .12s,box-shadow .12s;cursor:default}
.hand .card.ok{transform:translateY(-8px);border-color:var(--ac);cursor:pointer}
.hand .card.sel{transform:translateY(-18px);box-shadow:0 0 0 3px var(--ac),0 7px 0 rgba(0,0,0,.25);z-index:3}
.hand .card.no{filter:brightness(.55) saturate(.7)}
[data-cards=black] .hand .card.no{filter:brightness(.8) saturate(.7);opacity:.7}
.act{position:sticky;bottom:0;background:linear-gradient(rgba(0,0,0,0),var(--bg) 22%);padding:.7rem 0 calc(.2rem + env(safe-area-inset-bottom));z-index:5}
#app.game .act{position:static;background:var(--bg);padding:.5rem 0 calc(.2rem + env(safe-area-inset-bottom))}
.act .go{width:100%;font-size:1.05rem;padding:.9rem}
.calls{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.8rem,1fr));gap:.4rem;margin:.35rem 0 .2rem}
.calls button{padding:.6rem 0;font-weight:700;font-size:1.05rem;background:var(--panel)}
.note{text-align:center;font-size:.76rem;color:var(--mut);margin:.2rem 0}
.center{text-align:center}
/* chat box (floats over the players strip only) */
#chatbox{position:fixed;display:none;flex-direction:column;gap:.45rem;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border:1px solid var(--line);border-radius:16px;padding:.6rem .7rem}
.chead{display:flex;align-items:center;justify-content:space-between}
.chead .lab{color:var(--ac)}
.chead button{padding:.05rem .8rem;line-height:1.2}
.clist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;padding:.1rem 0}
.clist>:first-child{margin-top:auto}
.m{max-width:84%}
.m .mn{font-size:.66rem;font-weight:700;color:var(--ac);margin:0 .3rem .1rem}
.m .mt{background:color-mix(in srgb,var(--tx) 13%,transparent);border-radius:14px;padding:.4rem .7rem;font-size:.85rem;line-height:1.3;word-break:break-word}
.m.mine{align-self:flex-end}
.m.mine .mn{text-align:right}
.m.mine .mt{background:var(--ac);color:var(--btx)}
.m.sys{align-self:center;max-width:100%;font-size:.72rem;color:var(--mut);font-style:italic;text-align:center}
#cform{display:flex;gap:.4rem}
#cform input{padding:.5rem .7rem;font-size:.9rem}
#cform button{padding:.4rem .9rem}
/* sheets */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;padding:1rem 1.1rem 1.4rem}
.sheet h2{font-family:var(--serif);font-weight:500;font-size:1.4rem;margin:.1rem 0 .6rem;color:var(--ac)}
.sheet h3{font-size:.68rem;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin:1rem 0 .4rem;font-weight:500}
.sheet p,.sheet li{font-size:.92rem;line-height:1.55;margin:.3rem 0}
.sheet ul{padding-left:1.1rem;margin:.3rem 0}
.sbw{overflow:auto;max-height:min(58vh,30rem);border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.sb{border-collapse:separate;border-spacing:0;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
.sb th,.sb td{padding:.45rem .1rem;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;min-width:1.55rem}
.sb .g{border-left:1px solid var(--line)}
.sb thead th{position:sticky;background:var(--panel);z-index:2;color:var(--mut);font-weight:500;font-size:.72rem}
.sb thead tr:first-child th{top:0;height:2rem;padding:0 .2rem;color:var(--tx);max-width:5.5rem;overflow:hidden;text-overflow:ellipsis}
.sb thead tr:nth-child(2) th{top:2rem;font-size:.62rem;padding:.2rem}
.sb tbody td:first-child,.sb thead th:first-child,.sb tfoot td:first-child{position:sticky;left:0;z-index:3;background:var(--panel);text-align:left;padding-left:.5rem;font-family:var(--serif);min-width:3.6rem}
.sb thead th:first-child{z-index:4}
.sb tbody td.won{background:var(--won)}
.sb tbody td.won b{font-weight:700}
.sb s{color:var(--mut);text-decoration-thickness:2px}
.sb tr.cur td{background:var(--pill)}
.sb tr.cur td:first-child{color:var(--ac)}
.sb tr.fut td{color:var(--mut);opacity:.5}
.sb tfoot td{position:sticky;bottom:0;background:var(--pill);z-index:2;font-weight:700;color:var(--ac);font-size:.95rem;border-bottom:0;padding:.55rem .2rem}
.sb tfoot td:first-child{z-index:4;background:var(--pill);color:var(--tx);font-size:.82rem}
.sb tr.mer th,.sb th.mer{color:var(--ac)}
.legend{font-size:.76rem;color:var(--mut);margin:.55rem 0 0;line-height:1.5}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ac);color:var(--btx);padding:.55rem 1rem;border-radius:20px;font-size:.9rem;z-index:99;max-width:90vw;font-weight:600}
#fw{position:fixed;inset:0;z-index:60;pointer-events:none}
.gov{position:fixed;inset:0;z-index:61;display:flex;align-items:center;justify-content:center;padding:1.2rem;pointer-events:none}
.gov .box{pointer-events:auto;background:var(--bg);border:1px solid var(--ac);border-radius:18px;padding:1.4rem 1.2rem;text-align:center;max-width:380px;width:100%}
.gov .crown{font-family:var(--serif);font-size:1.1rem;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.gov .who{font-family:var(--serif);font-size:2.6rem;color:var(--ac);line-height:1.1;margin:.3rem 0 .2rem;word-break:break-word}
.gov .rk{display:flex;justify-content:space-between;font-size:.9rem;padding:.25rem 0;border-bottom:1px solid var(--line)}
.gov .btns{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.demobar{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);padding:.4rem .6rem;display:flex;gap:.4rem;align-items:center;justify-content:center;flex-wrap:wrap;font-size:.75rem;color:var(--mut)}
.demobar .chip{padding:.25rem .7rem;font-size:.8rem}
</style>
</head>
<body>
<div id="demobar"></div>
<div id="app"></div>
<div id="chatbox">

    this.trick = []; this.led = null; this.trickWinner = null;
    this.phase = 'playing';
    this.emit();
  };

  Game.prototype.endRound = function () {
    var res = {};
    this.players.forEach(function (p) {
      var pts = p.made === p.call ? 10 + p.call : 0;
      p.score += pts;
      res[p.id] = { call: p.call, made: p.made, pts: pts };
    });
    this.history.push({ i: this.round.i, cards: this.round.cards, cut: this.round.cut, res: res });
    this.trick = []; this.led = null; this.trickWinner = null;
    if (this.round.i >= this.per - 1) {
      var max = Math.max.apply(null, this.players.map(function (p) { return p.score; }));
      this.winners = this.players.filter(function (p) { return p.score === max; }).map(function (p) { return p.id; });
      this.phase = 'gameover';
    } else {
      this.phase = 'roundover';
    }
    this.emit();
  };

  // Arms one timer per turn. Chat, renames etc. call emit() too, so the timer is only
  // re-armed when the turn itself (or who is acting, or the timer setting) changes.
  Game.prototype.schedule = function () {
    var live = this.phase === 'calling' || this.phase === 'playing';
    var cur = live ? this.players[this.turnIdx] : null;
    if (!cur) {
      clearTimeout(this.timer); this.timer = null; this.schedKey = null; this.turnEnd = null;
      return;
    }
    var key = [this.phase, this.round.i, this.turnIdx, this.trick.length, cur.id, cur.bot ? 1 : 0, cur.connected ? 1 : 0, this.timerSec].join('|');
    if (key === this.schedKey && this.timer) return;
    clearTimeout(this.timer); this.timer = null;
    this.schedKey = key; this.turnEnd = null;
    var delay, timed = false;
    if (cur.bot) delay = this.fast ? 1 : 600 + rnd(500);
    else if (!cur.connected) delay = this.fast ? 1 : (this.autoMs || 25000);
    else if (this.timerSec) { delay = this.timerSec * 1000 * this.timerScale; timed = true; }
    else return;
    if (timed) this.turnEnd = Date.now() + delay;
    var self = this;
    this.timer = setTimeout(function () {
      self.timer = null; self.schedKey = null;
      if (timed && self.players[self.turnIdx] === cur && !cur.bot) {
        self.pushChat(null, '', 'Time’s up for ' + cur.name + ' — played automatically', true);
      }
      self.botAct(cur.id);
    }, delay);
  };

  Game.prototype.botAct = function (pid) {
    var cur = this.players[this.turnIdx];
    if (!cur || cur.id !== pid) return;
    // a human whose time ran out (or who is away) is played for at Medium, whatever the bot level is
    var level = cur.bot ? (cur.level || this.botLevel) : 'medium';
    if (this.phase === 'calling') {
      var cs = this.callState();
      var k = this.players.filter(function (p) { return p.call !== null; }).length;
      var n = Bot.call(cur.hand, this.round.cut, this.n, this.round.cards, cs.sum, cs.isLast, level, { k: k });
      this.doCall(cur, n);
    } else if (this.phase === 'playing') {
      var c = Bot.play(cur.hand, this.led, this.trick, this.round.cut, cur.call - cur.made, level, { n: this.n, played: this.played });
      this.doPlay(cur, c);
    }
  };

  Game.prototype.destroy = function () {
    clearTimeout(this.timer); clearTimeout(this.ttimer);
  };

  Game.prototype.snapshot = function (pid) {
    var me = this.byId(pid);
    var inGame = this.phase !== 'lobby';
    var humans = this.humans();
    var n = inGame ? this.n : Math.max(this.size, humans.length);
    var per = Math.floor(52 / n);
    var turn = (this.phase === 'calling' || this.phase === 'playing' || this.phase === 'trickdone') && this.players[this.turnIdx]
      ? this.players[this.turnIdx].id : null;
    var s = {
      code: this.code, phase: this.phase, me: pid, host: this.hostId,
      size: this.size, n: n, per: per, removed: 52 - n * per,
      botCount: inGame ? this.players.filter(function (p) { return p.bot; }).length : n - humans.length,
      players: this.players.map(function (p) {
        return { id: p.id, name: p.name, bot: p.bot, connected: p.connected, call: p.call, made: p.made, score: p.score };
      }),
      history: this.history, round: this.round, turn: turn, led: this.led,
      trick: this.trick, trickWinner: this.trickWinner, winners: this.winners,
      hand: me && inGame ? me.hand : [], legal: [], callInfo: null,
      timerSec: this.timerSec, botLevel: this.botLevel, seq: this.seq,
      turnLeft: this.turnEnd && (this.phase === 'calling' || this.phase === 'playing') ? Math.max(0, this.turnEnd - Date.now()) : null,
      chat: this.chat.slice(-50)
    };
    if (me && this.phase === 'playing' && turn === pid) s.legal = legalCards(me.hand, this.led);
    if (me && this.phase === 'calling' && turn === pid) s.callInfo = this.callState();
    return s;
  };

  return {
    Game: Game, Bot: Bot, SUITS: SUITS, SUIT_NAME: SUIT_NAME, CUT_ORDER: CUT_ORDER,
    suitOf: suitOf, rankOf: rankOf, legalCards: legalCards, trickWinner: trickWinner,
    newDeck: newDeck, shuffle: shuffle, cleanName: cleanName
  };
});

</script>
<script>
(function(){
'use strict';
var E=window.JEngine;
var DEMO=!!window.__DEMO;
var VER='v1 · Ishan Atul’s render';
var THEMES=[['mid','Midnight'],['ivo','Ivory'],['felt','Felt'],['ruby','Ruby']];
var SIZES=['Normal','Large','Larger','Huge'];
var FS=[16,18,20,23];
var TIMERS=[0,30,45,60,120];
var LEVELS=[['easy','Easy'],['medium','Medium'],['hard','Hard']];
function timerLabel(t){return !t?'Off':t<60?t+' s':(t/60)+' min'}
var SY={S:'♠',H:'♥',C:'♣',D:'♦'};
var SN=E.SUIT_NAME;
var RL={11:'J',12:'Q',13:'K',14:'A'};

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var ui=Object.assign({theme:'mid',cards:'white',fs:0},load('jd_ui',{}));
function setAppH(){document.documentElement.style.setProperty('--appH',innerHeight+'px')}   // some phone browsers get 100vh/100dvh wrong; the real visible height is innerHeight
setAppH();addEventListener('resize',setAppH);addEventListener('orientationchange',setAppH);
var snap=null,me=null,game=null,es=null,sess=load('jd_sess',null),isLocal=false;
var modal=null,modalFresh=false,pendingKick=null,fwStop=null,errMsg='';
var sel=null,chatOpen=false,chatSeen=0,turnDeadline=null;
var savedName=load('jd_name','');

function applyUI(){
  var h=document.documentElement;
  h.dataset.theme=ui.theme;h.dataset.cards=ui.cards;h.style.fontSize=FS[ui.fs]+'px';
  var m=document.querySelector('meta[name=theme-color]');
  var bg=getComputedStyle(h).getPropertyValue('--bg').trim();if(m&&bg)m.setAttribute('content',bg);
  save('jd_ui',{theme:ui.theme,cards:ui.cards,fs:ui.fs});
}
function toast(t){var el=$('#toast');el.innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){el.innerHTML=''},2600)}

/* ---------- transport ---------- */
function api(path,body){
  return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
var seq=-1,lastSse=0,conn='ok',failN=0,pollT=null,rtt=null,syncing=false,lastTry=0;
function connText(){
  if(conn==='off')return 'Offline. Waiting for the network…';
  if(conn==='wait')return 'Reconnecting…';
  return 'Connected'+(rtt!=null?' · '+rtt+' ms'+(rtt>800?' (slow)':''):'');
}
function paintConn(){
  var d=$('#cd'),t=$('#ct'),c=$('#connst');
  if(d)d.className='cd '+conn;
  if(t)t.textContent=conn==='ok'?'':(conn==='off'?' Offline':' Reconnecting…');
  if(c)c.textContent=connText();
}
function setConn(v){if(conn!==v){conn=v;paintConn()}}
function verHTML(){return '<div class="ver">'+VER+(sess&&!isLocal?'<span class="cd '+conn+'" id="cd"></span><span id="ct">'+(conn==='ok'?'':(conn==='off'?' Offline':' Reconnecting…'))+'</span>':'')+'</div>'}
function pingNow(){
  if(isLocal||DEMO||!sess)return;
  var t0=performance.now();
  fetch('/api/ping',{cache:'no-store'}).then(function(r){return r.json()}).then(function(){rtt=Math.round(performance.now()-t0);paintConn()}).catch(function(){});
}
setInterval(function(){if(modal==='settings')pingNow()},5000);
function onSnap(s){
  if(!isLocal&&!sess)return;   // late replies after leaving a room must not bring it back
  // updates can arrive twice (stream and action reply) or out of order: only newer ones count
  if(!isLocal&&s.seq!=null&&s.seq<=seq)return;
  if(s.seq!=null)seq=s.seq;
  // keep the selected card only while it is still playable
  if(sel&&(s.hand.indexOf(sel)<0||s.phase!=='playing'||s.turn!==s.me||s.legal.indexOf(sel)<0))sel=null;
  if(!sel&&s.phase==='playing'&&s.turn===s.me&&s.legal.length===1)sel=s.legal[0];
  turnDeadline=s.turnLeft==null?null:Date.now()+s.turnLeft;
  snap=s;
  if(chatOpen)chatSeen=lastChatId();
  render();
}
function roomGone(){
  if(es){es.close();es=null}
  stopPoll();sess=null;save('jd_sess',null);snap=null;modal=null;chatOpen=false;seq=-1;
  toast('That room is no longer available');render();
}
// ask the server for the current state (after a stall, on waking, or as the polling fallback)
function resync(){
  if(!sess||isLocal||syncing)return;
  syncing=true;
  fetch('/api/state?code='+sess.code+'&token='+sess.token,{cache:'no-store'})
    .then(function(r){return r.json().then(function(j){return{st:r.status,j:j}})})
    .then(function(x){
      syncing=false;
      if(x.st===404){roomGone();return}
      if(x.j&&x.j.s){setConn('ok');onSnap(x.j.s)}
    }).catch(function(){syncing=false;setConn(navigator.onLine===false?'off':'wait')});
}
function startPoll(){if(!pollT)pollT=setInterval(resync,1500)}
function stopPoll(){if(pollT){clearInterval(pollT);pollT=null}}
function connect(){
  if(es){try{es.close()}catch(e){}es=null}
  if(!sess)return;
  var my=es=new EventSource('/api/stream?code='+sess.code+'&token='+sess.token);
  var alive=function(){if(es!==my)return false;failN=0;lastSse=Date.now();stopPoll();setConn('ok');return true};
  my.onopen=alive;
  my.onmessage=function(e){if(alive())onSnap(JSON.parse(e.data))};
  my.addEventListener('hb',function(e){
    if(!alive())return;
    try{var d=JSON.parse(e.data);if(d.seq!=null&&d.seq>seq)resync()}catch(x){}
  });
  my.addEventListener('removed',function(){
    if(es!==my)return;
    my.close();es=null;stopPoll();sess=null;save('jd_sess',null);snap=null;modal=null;chatOpen=false;seq=-1;toast('You were removed from the room');render();
  });
  my.onerror=function(){
    if(es!==my)return;
    failN++;setConn(navigator.onLine===false?'off':'wait');
    if(my.readyState===2){es=null;resync()}   // closed for good (room gone, server restarted)
    if(failN>=3)startPoll();
  };
}
// the server sends a heartbeat every 10 s; silence for 25 s means the stream is dead
setInterval(function(){
  if(!sess||isLocal||!snap)return;
  if(Date.now()-lastSse>25000){
    setConn(navigator.onLine===false?'off':'wait');startPoll();
    if(Date.now()-lastTry>10000){lastTry=Date.now();connect();resync()}
  }
},4000);
function wake(){
  if(!sess||isLocal)return;
  resync();
  if(!es||es.readyState!==1||Date.now()-lastSse>15000)connect();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)wake()});
window.addEventListener('online',function(){setConn('wait');wake()});
window.addEventListener('offline',function(){setConn('off')});
window.addEventListener('pageshow',function(e){if(e.persisted)wake()});
function act(a){
  if(isLocal){var r=game.act(me,a);if(r&&r.err)toast(r.err);if(a.type==='chat')demoReply();return}
  var mine=sess;
  api('/api/act',{code:sess.code,token:sess.token,a:a}).then(function(r){
    if(r&&r.err){
      // a stale tap (turn already moved on, round already dealt): quietly refresh instead of an error
      if(r.err==='Not your turn'||r.err==='Not now'){resync();return}
      toast(r.err);return
    }
    if(sess!==mine)return;
    if(r&&r.s){onSnap(r.s);if(modal==='settings')renderModal()}
  }).catch(function(){toast('Connection problem');setTimeout(resync,800)});
}
function enter(r){
  sess={code:r.code,token:r.token};save('jd_sess',sess);me=r.pid;seq=-1;connect();
}
function create(){
  var n=$('#nm').value.trim();
  if(!n){errMsg='Enter your name to continue';render();return}
  savedName=n;save('jd_name',n);
  if(DEMO){startDemo(n);return}
  api('/api/create',{name:n}).then(function(r){if(r.err){errMsg=r.err;render();return}enter(r)}).catch(function(){errMsg='Could not reach the server';render()});
}
function join(){
  var n=$('#nm').value.trim(),c=$('#rc').value.trim().toUpperCase();
  if(!n){errMsg='Enter your name to continue';render();return}
  if(!c){errMsg='Enter a room code to join';render();return}
  savedName=n;save('jd_name',n);
  if(DEMO){errMsg='Demo has no live rooms. Use Start a room.';render();return}
  api('/api/join',{code:c,name:n}).then(function(r){if(r.err){errMsg=r.err;render();return}enter(r)}).catch(function(){errMsg='Could not reach the server';render()});
}
/* demo: the whole game runs in this page; the other two "friends" are auto-played */
function startDemo(n){
  isLocal=true;game=new E.Game('DEMO');game.autoMs=700;
  var r=game.addHuman(n,'demo');me=r.pid;
  game.addHuman('Atul','demo');game.addHuman('Rahul','demo');game.size=5;
  game.onChange=function(){
    game.humans().forEach(function(p){p.connected=(game.phase==='lobby')||p.id===me});
    game.schedule();
    var s=game.snapshot(me);s.players.forEach(function(p){p.connected=true});onSnap(s);
  };

}
var DEMO_LINES=['Bold call. Watch the cut.','Hawk is sitting on a cut, I can feel it','Nice one','This hand is rough 😅','Let’s go!'];
function demoReply(){
  if(!game||demoReply.busy)return;
  demoReply.busy=true;
  setTimeout(function(){
    demoReply.busy=false;if(!game)return;
    var others=game.humans().filter(function(p){return p.id!==me});
    if(others.length)game.act(others[Math.floor(Math.random()*others.length)].id,{type:'chat',text:DEMO_LINES[Math.floor(Math.random()*DEMO_LINES.length)]});
  },1100);
}
function setView(id){me=id;sel=null;game.onChange()}
function demoBar(){
  var el=$('#demobar');
  if(!DEMO||!game){el.innerHTML='';document.documentElement.style.setProperty('--demo','0px');return}
  var h='<div class="demobar"><span>Phone view</span>';
  game.humans().forEach(function(p){h+='<button class="chip '+(p.id===me?'on':'')+'" data-a="view" data-p="'+p.id+'">'+esc(p.name)+(p.id===game.hostId?' (host)':'')+'</button>'});
  el.innerHTML=h+'</div>';

}
function leave(){
  if(DEMO){location.reload();return}
  if(isLocal){game.destroy();game=null;isLocal=false}
  else{act({type:'leave'});if(es){es.close();es=null}stopPoll();sess=null;seq=-1;save('jd_sess',null)}
  snap=null;modal=null;chatOpen=false;sel=null;stopFw();render();
}
function tryRejoin(){
  if(!sess)return;
  api('/api/rejoin',sess).then(function(r){if(r.err){sess=null;save('jd_sess',null);render();return}me=r.pid;connect()}).catch(function(){});
}

/* ---------- helpers ---------- */
function player(id){return snap.players.filter(function(p){return p.id===id})[0]}
function nameOf(id){var p=player(id);return p?p.name:'?'}
function cutLabel(c){return c?SY[c]+' '+SN[c]:'No cut'}
function isRed(s){return s==='H'||s==='D'}
function rankL(c){var r=+c.slice(1);return RL[r]||r}
function lastChatId(){return snap&&snap.chat&&snap.chat.length?snap.chat[snap.chat.length-1].id:0}
function cw(){var a=$('#app');if(!a||!a.clientWidth)return 330;var cs=getComputedStyle(a);return Math.max(240,a.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight))}

/* A card. o = {w,h,ix (index font px), cls, attrs, ml (margin-left px)} */
function cardHTML(c,o){
  var s=c[0],L=rankL(c),fs=Math.round(o.h*(o.h<100?.3:.36));
  var ix='<span class="ix%B" style="font-size:'+o.ix+'px">'+L+'<br>'+SY[s]+'</span>';
  return '<div class="card '+(isRed(s)?'red ':'')+(o.cls||'')+'" '+(o.attrs||'')+' style="width:'+o.w+'px;height:'+o.h+'px;font-size:'+fs+'px'+(o.ml?';margin-left:'+o.ml+'px':'')+'">'
    +ix.replace('%B','')+'<span>'+SY[s]+'</span>'+ix.replace('%B',' br')+'</div>';
}
function backFan(){
  var k=innerHeight>=830?1:innerHeight>=760?.9:innerHeight>=690?.76:innerHeight>=620?.56:.48;
  var cs=[['A','S'],['K','H'],['Q','D'],['J','C'],['10','S']],h='',w=Math.round(104*k),hh=Math.round(146*k),fs=Math.round(54*k),ixs=Math.round(20*k),W=Math.round(340*k),L=Math.round(118*k);
  cs.forEach(function(c,i){
    var s=c[1],ix='<span class="ix%B" style="font-size:'+ixs+'px">'+c[0]+'<br>'+SY[s]+'</span>';
    h+='<div class="card pc '+(isRed(s)?'red':'')+'" style="width:'+w+'px;height:'+hh+'px;font-size:'+fs+'px;left:'+L+'px;transform:rotate('+((i-2)*17)+'deg);animation-delay:'+(i*.12)+'s">'
      +ix.replace('%B','')+'<span>'+SY[s]+'</span>'+ix.replace('%B',' br')+'</div>';
  });
  return '<div class="fan" style="width:'+W+'px;height:'+Math.round(172*k)+'px;margin-bottom:'+Math.round(52*k)+'px">'+h+'</div>';
}
function pill(){
  var mp=snap&&player(snap.me);
  return '<button class="pillb" data-a="settings" aria-label="Settings"><span class="av">'+esc(mp?Array.from(mp.name)[0].toUpperCase():'?')+'</span><span class="pn">'+esc(mp?mp.name:'')+'</span><span class="gear">⚙︎</span></button>';
}
function topbar(){
  return '<div class="top"><button class="ib" data-a="rules">Rules</button><button class="codechip" data-a="copy" aria-label="Copy invite link">'+(DEMO?'DEMO':esc(snap.code))+'</button>'+pill()+'</div>';
}
function botChips(isHost,cur){
  var h='<div class="chips">';
  LEVELS.forEach(function(l){h+='<button class="chip '+(cur===l[0]?'on':'')+'" '+(isHost?'data-a="level" data-v="'+l[0]+'"':'disabled')+'>'+l[1]+'</button>'});

function timerChips(isHost,cur){
  var h='<div class="chips">';
  TIMERS.forEach(function(t){h+='<button class="chip '+(cur===t?'on':'')+'" '+(isHost?'data-a="timer" data-s="'+t+'"':'disabled')+'>'+timerLabel(t)+'</button>'});
  return h+'</div>';
}

/* ---------- screens ---------- */
function renderHome(){
  var q=new URLSearchParams(location.search).get('room')||'';
  var h='<div class="ver">'+VER+'</div>'
   +'<div class="top"><button class="ib" data-a="rules">Rules</button><button class="pillb" data-a="settings"><span class="gear" style="margin:0">⚙︎</span> Settings</button></div>'
   +'<div class="hero">'+backFan()+'<div class="title">Judgement</div>'
   +'<div class="words"><span class="w w1">Call it.</span><span class="w w2">Make it.</span><span class="w w3">Win it.</span></div>'
   +'</div>'
   +'<div class="home"><input id="nm" maxlength="16" placeholder="Your name (required)" value="'+esc(savedName)+'" autocomplete="off">'
   +'<div class="err">'+esc(errMsg)+'</div>'
   +'<button class="pri big" data-a="create">Start a room</button>';
  h+='<div class="or">OR JOIN A FRIEND</div>'
   +'<div class="row2"><input id="rc" maxlength="4" placeholder="Room code" value="'+esc(q.toUpperCase())+'" style="text-transform:uppercase;letter-spacing:.3em;font-family:ui-monospace,Menlo,monospace"><button data-a="join">Join room</button></div>';
  if(DEMO)h+='<div class="note" style="margin-top:.7rem;line-height:1.5">Demo: friends join automatically. Codes work in the live app.</div>';
  h+='</div>';
  $('#app').innerHTML=h;
  errMsg='';
}
function renderLobby(){
  var s=snap,isHost=s.host===s.me,humans=s.players.length,bots=s.botCount,total=s.n;
  var h=verHTML()+topbar()
   +'<div class="center" style="margin:.9rem 0 .3rem"><div class="lab">Share this room</div><div class="bigcode" data-a="copy" aria-label="Copy invite link">'+(DEMO?'DEMO':esc(s.code))+'</div>'
   +(DEMO?'':'<div style="margin-top:.5rem"><button class="sm" style="padding:.4rem 1rem;font-size:.85rem;border-radius:20px" data-a="copy">Copy invite link</button></div>')+'</div>'
   +'<div class="row2" style="justify-content:space-between;align-items:center;margin:1rem 0 .5rem"><span class="lab">Players at the table</span><span style="font-weight:600">'+total+' <span class="tag">of 3–8</span></span></div>';
  s.players.forEach(function(p){
    h+='<div class="seatrow"><div class="av">'+esc(Array.from(p.name)[0].toUpperCase())+'</div><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(p.name)+(p.id===s.me?' (you)':'')+'</span>'
     +'<span class="tag">'+(p.id===s.host?'Host':(p.connected?'Joined':'Away'))+'</span>'
     +(isHost&&p.id!==s.me?'<button class="sm" data-a="kick" data-p="'+p.id+'">Remove</button>':'')+'</div>';
  });

/* Picks rows / card size so every player's slot fits the space the table actually has. */
function tableLayout(n,W,avail){
  /* height a layout really needs: padding 32 + rows of (card + name 17) + 22px between rows (room for the LEADS/CUT tag) */
  function need(rows,th){return 32+rows*(th+17)+(rows-1)*22}
  function pick(minTw,spare){
    var best=null;
    [1,2,3].forEach(function(rows){
      var per=Math.ceil(n/rows);
      if(rows>1&&per<2)return;
      var byH=Math.floor(((avail-spare-32-(rows-1)*22)/rows-17)/1.4);   // widest card the height allows for this many rows
      var tw=Math.min(100,Math.floor((W-14)/per)-10,byH),th=Math.round(tw*1.4);
      if(tw<minTw||need(rows,th)+spare>avail)return;
      if(!best||tw>best.tw)best={rows:rows,per:per,tw:tw,th:th};
    });
    return best;
  }
  var best=pick(34,18);                      // roomy: also leaves space for the "Hand x of y" caption
  if(best){best.fit=true;return best}
  best=pick(28,0);                           // tight: smaller cards, no caption
  if(best){best.fit=false;return best}
  var rows=n>6?2:1,per=Math.ceil(n/rows),th0=Math.floor((avail-32-(rows-1)*22)/rows)-17;   // nothing fits: shrink as far as sensible
  var tw=Math.max(26,Math.min(Math.floor((W-14)/per)-10,Math.floor(th0/1.4)));
  return {rows:rows,per:per,tw:tw,th:Math.round(tw*1.4),fit:false};
}
function fillTable(W){
  var tb=$('#tbl');
  if(!tb||!snap||!snap.round)return;
  var s=snap,r=s.round,n=s.players.length;
  var L=tableLayout(n,W,tb.clientHeight),tw=L.tw,th=L.th,ixf=Math.max(10,Math.min(22,Math.round(th*.17)));
  var lead=s.trick.length?s.trick[0].pid:s.turn,start=0;
  s.players.forEach(function(p,i){if(p.id===lead)start=i});
  var order=s.players.slice(start).concat(s.players.slice(0,start));
  var h='<div class="slots" style="width:'+(L.per*(tw+10))+'px">';
  order.forEach(function(p){
    var t=s.trick.filter(function(x){return x.pid===p.id})[0],rib='';
    if(t){
      if(s.trick[0]===t)rib='<div class="rib l">LEADS '+SY[s.led]+'</div>';
      else if(r.cut&&r.cut!==s.led&&t.card[0]===r.cut)rib='<div class="rib c">CUT '+SY[r.cut]+'</div>';
    }
    h+='<div class="slot '+(s.trickWinner===p.id&&t?'win':'')+'" style="width:'+(tw+6)+'px">'+rib
      +(t?cardHTML(t.card,{w:tw,h:th,ix:ixf}):'<div class="empty '+(s.turn===p.id&&s.phase==='playing'?'turn':'')+'" style="width:'+tw+'px;height:'+th+'px"></div>')
      +'<div class="sn">'+(p.id===s.me?'You':esc(p.name))+'</div></div>';
  });
  tb.innerHTML=(L.fit?'<div class="tlab">Hand '+handNo()+' of '+r.cards+'</div>':'')+h+'</div>';
}
function handHTML(W){
  var s=snap,hand=s.hand,n=hand.length;
  if(!n)return '<div class="hand" style="padding-top:0"></div>';
  var GAP=6,SG=8,groups=0,hcap=Math.max(54,Math.round(innerHeight*.098)),w=Math.min(100,hcap,Math.max(Math.round(W*.215),Math.floor((W-(n-1)*GAP)/n))),hh=Math.round(w*1.4);
  hand.forEach(function(c,i){if(i&&c[0]!==hand[i-1][0])groups++});
  var step=(n*w+(n-1)*GAP+groups*SG<=W)?w+GAP:(W-w-groups*SG)/(n-1);
  var vis=Math.min(step,w)-6,ix=Math.max(11,Math.min(17,Math.round(hh*.15)));
  if(vis<ix*1.25)ix=Math.max(11,Math.floor(vis/1.15));
  var myTurn=s.phase==='playing'&&s.turn===s.me,h='<div class="hand">';
  hand.forEach(function(c,i){
    var ok=myTurn&&s.legal.indexOf(c)>=0,no=myTurn&&!ok;
    var ml=i?Math.round(step-w+((c[0]!==hand[i-1][0])?SG:0)):0;
    h+=cardHTML(c,{w:w,h:hh,ix:ix,ml:ml,cls:(c===sel?'sel':(ok?'ok':(no?'no':''))),attrs:ok?'data-a="pick" data-c="'+c+'"':''});
  });
  return h+'</div>';
}

function screenHTML(){
  var s=snap,hist=s.history,live=s.round&&(s.phase==='calling'||s.phase==='playing'||s.phase==='trickdone');
  var order=s.players.slice();
  if(s.phase==='gameover')order.sort(function(a,b){return b.score-a.score});
  var h='<div class="sbw"><table class="sb"><thead><tr><th>Round</th>';
  order.forEach(function(p){h+='<th colspan="2" class="g'+(p.id===s.me?' mer':'')+'">'+esc(p.name)+'</th>'});
  h+='</tr><tr><th></th>';
  order.forEach(function(){h+='<th class="g">Call</th><th>Made</th>'});
  h+='</tr></thead><tbody>';
  for(var i=0;i<s.per;i++){
    var cards=s.per-i,cut=E.CUT_ORDER[i%5];
    var lab='R'+(i+1)+' '+cards+(cut?SY[cut]:'∅');
    if(i<hist.length){
      h+='<tr'+(i===hist.length-1?' id="lastrow"':'')+'><td>'+lab+'</td>';
      order.forEach(function(p){
        var x=hist[i].res[p.id],won=x.made===x.call;
        h+='<td class="g'+(won?' won':'')+'">'+(won?'<b>'+x.call+'</b>':'<s>'+x.call+'</s>')+'</td><td'+(won?' class="won"':'')+'>'+x.made+'</td>';
      });
      h+='</tr>';
    }else if(live&&i===s.round.i){
      h+='<tr class="cur" id="lastrow"><td>'+lab+'</td>';
      order.forEach(function(p){h+='<td class="g">'+(p.call===null?'…':p.call)+'</td><td>'+(p.call===null?'':p.made)+'</td>'});
      h+='</tr>';
    }else{
      h+='<tr class="fut"><td>'+lab+'</td>';
      order.forEach(function(){h+='<td class="g">·</td><td>·</td>'});
      h+='</tr>';
    }
  }
  h+='</tbody><tfoot><tr><td>Total</td>';
  order.forEach(function(p){h+='<td colspan="2" class="g">'+p.score+'</td>'});
  h+='</tr></tfoot></table></div><div class="legend">Highlighted: call made (10 + call). Struck-off call: missed, 0 points. Shaded row: round in progress, made so far. ∅ = no cut. Scroll sideways or down for more.</div>';

function renderOver(){
  var el=$('#over');
  if(!snap||snap.phase!=='gameover'){el.innerHTML='';stopFw();return}
  if(modal==='screen'||modal==='rules'||modal==='settings'){el.innerHTML='';return}
  var s=snap,names=s.winners.map(nameOf).join(' & ');
  var order=s.players.slice().sort(function(a,b){return b.score-a.score});
  var h='<div class="gov"><div class="box"><div class="crown">'+(s.winners.length>1?'Joint winners':'Winner')+'</div><div class="who">'+esc(names)+'</div>';
  order.forEach(function(p,i){h+='<div class="rk"><span>'+(i+1)+'. '+esc(p.name)+'</span><b>'+p.score+'</b></div>'});
  h+='<div class="btns"><button data-a="screen">View screen</button>'
   +(s.host===s.me?'<button class="pri" data-a="again">Play again</button>':'<span class="tag" style="align-self:center">Waiting for host</span>')
   +'<button data-a="leave">Leave</button></div></div></div>';
  el.innerHTML=h;
  startFw();
}
function startFw(){
  if(fwStop)return;
  var cv=$('#fw');cv.style.display='block';
  var ctx=cv.getContext('2d'),W,H,parts=[],run=true,last=0,cols=['#F2B632','#E5484D','#4FC3A1','#6EA8FF','#FF7AB6','#FFFFFF'];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
  function burst(){
    var x=W*(.15+Math.random()*.7),y=H*(.12+Math.random()*.4),c=cols[Math.floor(Math.random()*cols.length)];
    for(var i=0;i<60;i++){var a=Math.random()*6.283,sp=1.5+Math.random()*3.5;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:c})}
  }
  function loop(t){
    if(!run)return;
    if(t-last>480){burst();last=t}
    ctx.clearRect(0,0,W,H);
    parts=parts.filter(function(p){return p.l>0});
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.99;p.l-=.012;ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,6.283);ctx.fill()});
    ctx.globalAlpha=1;requestAnimationFrame(loop);
  }
  burst();requestAnimationFrame(loop);
  fwStop=function(){run=false;cv.style.display='none';ctx.clearRect(0,0,W,H);fwStop=null};
}
function stopFw(){if(fwStop)fwStop()}

/* ---------- main render ---------- */
function render(){
  $('#app').className=(snap&&snap.phase!=='lobby')?'game':'';
  demoBar();
  if(!snap)renderHome();
  else if(snap.phase==='lobby')renderLobby();
  else renderGame();
  // sheets that don't depend on live data are left alone so typing and scrolling survive updates
  if(modal!=='settings'&&modal!=='rules')renderModal();
  renderOver();
  placeChat();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');
  if(!t)return;
  if(t.classList.contains('mask')&&e.target!==t)return;
  var a=t.dataset.a;
  switch(a){
    case 'create':create();break;
    case 'join':join();break;
    case 'view':setView(parseInt(t.dataset.p,10));break;
    case 'rules':showModal('rules');break;
    case 'settings':showModal('settings');break;
    case 'screen':showModal('screen');break;
    case 'close':closeModal();renderOver();break;
    case 'copy':{
      if(DEMO){toast('Demo room');break}
      var link=location.origin+location.pathname+'?room='+snap.code;
      if(navigator.clipboard)navigator.clipboard.writeText(link).then(function(){toast('Invite link copied')},function(){toast(link)});else toast(link);
      break}
    case 'size':{var d=parseInt(t.dataset.d,10);act({type:'size',size:snap.n+d});break}
    case 'timer':act({type:'timer',sec:parseInt(t.dataset.s,10)});if(modal==='settings')setTimeout(renderModal,60);break;
    case 'level':act({type:'level',level:t.dataset.v});if(modal==='settings')setTimeout(renderModal,60);break;
    case 'start':act({type:'start'});break;
    case 'call':act({type:'call',n:parseInt(t.dataset.n,10)});break;
    case 'pick':sel=(sel===t.dataset.c)?null:t.dataset.c;render();break;
    case 'submit':if(sel){var c=sel;sel=null;act({type:'play',card:c});render()}break;
    case 'chat':if(chatOpen)closeChat();else openChat();break;
    case 'chatclose':closeChat();break;
    case 'next':act({type:'next'});break;
    case 'again':act({type:'again'});break;
    case 'kick':act({type:'kick',pid:parseInt(t.dataset.p,10)});break;
    case 'kickask':pendingKick=parseInt(t.dataset.p,10);renderModal();break;
    case 'kickno':pendingKick=null;renderModal();break;
    case 'kickyes':act({type:'kick',pid:parseInt(t.dataset.p,10)});pendingKick=null;setTimeout(renderModal,60);break;
    case 'rename':{var v=$('#sn').value.trim();if(!v){toast('Enter a name');break}savedName=v;save('jd_name',v);act({type:'rename',name:v});toast('Name saved');break}
    case 'fs':ui.fs=parseInt(t.dataset.i,10);applyUI();renderModal();render();break;
    case 'theme':ui.theme=t.dataset.t;applyUI();renderModal();break;
    case 'cards':ui.cards=t.dataset.v;applyUI();renderModal();break;
    case 'leave':leave();break;
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='cform')return;
  e.preventDefault();
  var i=$('#cin'),v=i.value.trim();
  if(!v)return;
  act({type:'chat',text:v});i.value='';i.focus();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!snap){if(e.target.id==='rc')join();else if(e.target.id==='nm')create()}
});
document.addEventListener('scroll',function(){if(chatOpen)placeChat()},true);
var rsT=null;
addEventListener('resize',function(){
  clearTimeout(rsT);
  rsT=setTimeout(function(){if(snap&&snap.phase!=='lobby')render();else placeChat()},120);
});

applyUI();render();
if(sess&&!DEMO)tryRejoin();
// small hook so the connection logic can be tested from outside
window.__jd={st:function(){return{seq:seq,conn:conn,poll:!!pollT,snap:snap}},
  kill:function(stale){if(es)es.close();lastSse=Date.now()-(stale||0)},
  fakeStream:function(){window.__ES=window.__ES||window.EventSource;window.EventSource=function(){this.readyState=0;this.close=function(){};this.addEventListener=function(){}};if(es)es.close();connect();lastSse=Date.now()-30000},
  realStream:function(){if(window.__ES)window.EventSource=window.__ES;connect()},
  act:act,wake:wake};
})();
</script>
