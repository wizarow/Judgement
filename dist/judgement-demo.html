<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFE3">
<title>Judgement Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Kalam:wght@400;700&display=block" rel="stylesheet">
<style>
:root{
  --page:#F4F0E4;--desk:#DCD5C3;--rule:#C3D3E8;--margin:#E2A49C;
  --ink:#1F3A9A;--ink-soft:rgba(31,58,154,.12);--red:#C2281C;--graphite:#2C2B28;--pencil:#66645E;
  --hl:rgba(255,214,0,.55);--sticky:#FBE88A;--sticky-ink:#3A3110;
  --card:#FFFDF7;--card-ink:#1B1B1B;--card-red:#C0281C;--card-line:#D8D0BC;
  --shadow:0 1px 2px rgba(40,30,10,.18),0 6px 14px rgba(40,30,10,.10);
  --hand:'Kalam','Hind',system-ui,sans-serif;--print:'Hind',system-ui,sans-serif;
  --lh:1.75rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-paper]):not([data-theme="light"]){
    --page:#18181B;--desk:#0E0E10;--rule:#2A3142;--margin:#5E2C2C;
    --ink:#9DB8FF;--ink-soft:rgba(157,184,255,.14);--red:#FF7A6B;--graphite:#ECE8DD;--pencil:#A4A29B;
    --hl:rgba(196,255,64,.22);--sticky:#3D3820;--sticky-ink:#F4EBC0;
    --card:#F2EEE3;--card-line:#3A3A40;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-paper="black"],:root:not([data-paper])[data-theme="dark"],:root[data-paper="chalk"],:root[data-paper="midnight"]{
  --page:#18181B;--desk:#0E0E10;--rule:#2A3142;--margin:#5E2C2C;
  --ink:#9DB8FF;--ink-soft:rgba(157,184,255,.14);--red:#FF7A6B;--graphite:#ECE8DD;--pencil:#A4A29B;
  --hl:rgba(196,255,64,.22);--sticky:#3D3820;--sticky-ink:#F4EBC0;
  --card:#F2EEE3;--card-line:#3A3A40;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-ink="black"]{--ink:#1E1E22;--ink-soft:rgba(30,30,34,.10)}
@media (prefers-color-scheme:dark){:root[data-ink="black"]:not([data-paper]):not([data-theme="light"]){--ink:#F2EEE6;--ink-soft:rgba(242,238,230,.14)}}
:root[data-ink="black"][data-paper="black"],:root[data-ink="black"]:not([data-paper])[data-theme="dark"],:root[data-ink="black"][data-paper="chalk"],:root[data-ink="black"][data-paper="midnight"]{--ink:#F2EEE6;--ink-soft:rgba(242,238,230,.14)}
:root[data-ink="green"]{--ink:#1D6A43;--ink-soft:rgba(29,106,67,.12)}
@media (prefers-color-scheme:dark){:root[data-ink="green"]:not([data-paper]):not([data-theme="light"]){--ink:#86DDB0;--ink-soft:rgba(134,221,176,.14)}}
:root[data-ink="green"][data-paper="black"],:root[data-ink="green"]:not([data-paper])[data-theme="dark"],:root[data-ink="green"][data-paper="chalk"],:root[data-ink="green"][data-paper="midnight"]{--ink:#86DDB0;--ink-soft:rgba(134,221,176,.14)}
:root[data-ink="purple"]{--ink:#5A2A98;--ink-soft:rgba(90,42,152,.12)}
@media (prefers-color-scheme:dark){:root[data-ink="purple"]:not([data-paper]):not([data-theme="light"]){--ink:#C9A8FF;--ink-soft:rgba(201,168,255,.15)}}
:root[data-ink="purple"][data-paper="black"],:root[data-ink="purple"]:not([data-paper])[data-theme="dark"],:root[data-ink="purple"][data-paper="chalk"],:root[data-ink="purple"][data-paper="midnight"]{--ink:#C9A8FF;--ink-soft:rgba(201,168,255,.15)}
:root[data-ink="red"]{--ink:#A3241A;--ink-soft:rgba(163,36,26,.11)}
@media (prefers-color-scheme:dark){:root[data-ink="red"]:not([data-paper]):not([data-theme="light"]){--ink:#FF9A8C;--ink-soft:rgba(255,154,140,.15)}}
:root[data-ink="red"][data-paper="black"],:root[data-ink="red"]:not([data-paper])[data-theme="dark"],:root[data-ink="red"][data-paper="chalk"],:root[data-ink="red"][data-paper="midnight"]{--ink:#FF9A8C;--ink-soft:rgba(255,154,140,.15)}
:root[data-paper="legal"],:root[data-paper="mint"],:root[data-paper="blush"],:root[data-paper="sky"],:root[data-paper="kraft"]{color-scheme:light}
:root[data-paper="legal"]{--page:#FBF1BE;--desk:#E6D78F;--rule:#A9C4DE;--margin:#E0877C}
:root[data-paper="mint"]{--page:#E6F3EA;--desk:#C9DFD0;--rule:#B4CFE0;--margin:#E39A93}
:root[data-paper="blush"]{--page:#FBE9E7;--desk:#EACFCB;--rule:#C9D3E8;--margin:#E08F86}
:root[data-paper="sky"]{--page:#E7EFF8;--desk:#CBD9EA;--rule:#A9C0DD;--margin:#E39A93}
:root[data-paper="kraft"]{--page:#DCC7A1;--desk:#BFA77C;--rule:#B7A57F;--margin:#B5534A;--pencil:#5A4E3A;--graphite:#241F17;--red:#8E1A12}
:root[data-paper="kraft"][data-ink="green"]{--ink:#134A2C;--ink-soft:rgba(19,74,44,.12)}
:root[data-paper="kraft"][data-ink="red"]{--ink:#7E1710;--ink-soft:rgba(126,23,16,.11)}
:root[data-paper="chalk"]{--page:#1E3A2C;--desk:#12261C;--rule:#2C5140;--margin:#7C4038;--graphite:#EEF2EA;--pencil:#A9BDB1}
:root[data-paper="midnight"]{--page:#131A30;--desk:#0A0F1E;--rule:#25304F;--margin:#5E2E3E;--graphite:#E8EAF2;--pencil:#9CA4BE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;--appH:100dvh;overscroll-behavior-y:none}
body{margin:0;background:var(--desk);color:var(--graphite);font-family:var(--print);line-height:var(--lh);min-height:var(--appH);overflow-x:hidden;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:var(--page)}
input{caret-color:var(--ink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px dashed var(--ink);outline-offset:3px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
svg{display:block}
.ink{font-family:var(--hand);color:var(--ink)}
.pr{font-family:var(--print);color:var(--pencil);font-size:.82rem;line-height:1.2}
.red{color:var(--red)}

/* the page */
#app{position:relative;max-width:480px;margin:0 auto;min-height:var(--appH);background-color:var(--page);
  background-image:
    linear-gradient(to right,transparent 26px,var(--margin) 26px,var(--margin) 27px,transparent 27px,transparent 30px,var(--margin) 30px,var(--margin) 31px,transparent 31px),
    linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));
  background-size:100% 100%,100% var(--lh);
  padding-block:0;padding-left:max(40px,calc(env(safe-area-inset-left,0px) + 24px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
@media (min-width:520px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 20px 50px rgba(0,0,0,.18)}}
/* Fit mode (default): the game fills the window. If anything does not fit it scrolls, and the dock
   (calling pad, status, your hand, Play button) stays pinned to the bottom so cards are never out of reach. */
#app.game{height:calc(var(--appH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
.dock{flex:none;position:sticky;bottom:0;z-index:6;display:flex;flex-direction:column}
#app.scrolling .dock{background-color:var(--page);box-shadow:0 -10px 12px -10px rgba(0,0,0,.28)}
/* Scrolling mode (Settings > Game screen, or switched on automatically when the hand would be off screen):
   the page itself scrolls and the table keeps a comfortable height. */
html[data-screen="scroll"] #app.game{height:auto;min-height:calc(var(--appH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:visible}
html[data-screen="scroll"] .table{min-height:11rem}
/* Landscape phones: table and players on the left, calling pad and hand on the right */
@media (orientation:landscape) and (max-height:600px){
  #app.game{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:1.2rem;align-content:start}
  html[data-screen="scroll"] #app.game{grid-template-rows:auto auto 1fr}
  #app.game>.hd{grid-column:1;grid-row:1}
  #app.game>.lg{grid-column:1;grid-row:2}
  #app.game>.table{grid-column:1;grid-row:3;min-height:5rem}
  #app.game>.dock{grid-column:2;grid-row:1 / span 3;align-self:end}
  #app.game.sc{display:flex}
}

/* buttons, drawn boxes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:.35rem 1.1rem;
  border:1.75px solid var(--ink);color:var(--ink);font-family:var(--hand);font-size:1.15rem;font-weight:700;
  border-radius:255px 14px 225px 14px/14px 225px 14px 255px;transition:transform .15s cubic-bezier(.2,.8,.2,1),background-color .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--page)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{width:100%}
.ib{width:2.5rem;height:2.5rem;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);position:relative;border-radius:50%}
.ib svg{width:1.4rem;height:1.4rem}
.ib:active{background:var(--ink-soft)}
.badge{position:absolute;top:.1rem;right:.05rem;min-width:1.1rem;height:1.1rem;padding:0 .25rem;border-radius:1rem;background:var(--red);color:#fff;font:600 .68rem/1.1rem var(--print);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{min-height:2.25rem;min-width:2.5rem;padding:0 .8rem;font-family:var(--hand);font-size:1.05rem;color:var(--ink);
  border:1.5px solid transparent;border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
@media (hover:hover) and (pointer:fine){.chip:hover{border-color:var(--ink-soft)}}
.chip.on{border-color:var(--ink);background:var(--ink-soft);font-weight:700}

/* home */
.home{flex:1 0 auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.hm{margin-block:auto;padding-block:calc(var(--lh)*.5)}
.vline{flex:none;height:18px;display:flex;align-items:flex-end;justify-content:center;font:500 13px/1 var(--print);color:var(--pencil);letter-spacing:.02em;white-space:nowrap}
.swatch{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;margin-right:.35rem;vertical-align:-.05rem}
.swatch.paper{border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.invite{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:calc(var(--lh)*.5) 0;text-align:center}
.code.big{font-size:2.3rem;padding:.5rem .6rem .5rem 1rem;letter-spacing:.35em}
.dot{flex:none;width:.55rem;height:.55rem;border-radius:50%;background:var(--rule)}
.dot.on{background:#3E9B5B}
.joined-now{animation:joinin .6s cubic-bezier(.2,.9,.3,1) both}
@keyframes joinin{from{opacity:0;transform:translateX(-12px)}}
.joined-now .nm{background:linear-gradient(100deg,transparent 2%,var(--hl) 6%,var(--hl) 94%,transparent 98%) no-repeat;background-size:100% 100%}
.wait{font-family:var(--hand);font-size:1.15rem;color:var(--ink)}
.wait i{display:inline-block;animation:blink 1.2s infinite both;font-style:normal}.wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.stepper{display:flex;align-items:center;gap:.8rem}
.stepper .ink{font-size:1.15rem}
.linkish{font-family:var(--hand);font-size:1rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:.3rem 0}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:2.6rem}
.topbar .vline{height:auto;align-items:center}
.topbar .ib{justify-self:end}
.topbar .linkish{justify-self:start;font-size:.95rem}
.hero{position:relative;text-align:center}
.fan{position:relative;width:100%;cursor:pointer}
.fan .card{position:absolute;left:50%;top:14px;transform-origin:50% 140%}
.fan .card.drop{animation-duration:.55s}
.ttl{margin:calc(var(--lh)*.5) 0 0;font-family:var(--hand);font-weight:700;color:var(--ink);font-size:clamp(3rem,15vw,4.2rem);line-height:calc(var(--lh)*2);letter-spacing:-.01em}
.ttl-u{margin-inline:auto;width:min(100%,17rem);height:14px;margin-top:-2px;color:var(--red)}
.tag3{margin:calc(var(--lh)*.5) 0 0;font-family:var(--hand);font-size:1.5rem;line-height:var(--lh);color:var(--graphite)}
.tag3 span{display:inline-block;margin-right:.45rem}
.tag3 .w3{position:relative;margin-left:.45rem;color:var(--red);font-weight:700}
.tag3 .w3 svg{position:absolute;inset:-8px -12px -6px -10px;width:calc(100% + 22px);height:calc(100% + 14px);color:var(--red);overflow:visible}
.setup{margin-top:calc(var(--lh)*1.5);display:flex;flex-direction:column;gap:calc(var(--lh)*.5)}
.fl{display:flex;flex-direction:column;gap:.2rem}
.fl>.pr{font-weight:500;color:var(--graphite);font-size:.9rem}
.line-in{width:100%;height:calc(var(--lh)*1.5);background:transparent;border:0;border-bottom:1.75px solid var(--ink);
  font-family:var(--hand);font-size:1.5rem;color:var(--ink);padding:0 .1rem;outline:none;border-radius:0}
.line-in::placeholder{color:var(--pencil);opacity:.8}
.line-in:focus-visible{outline:none;border-bottom-width:2.5px}
.err{color:var(--red);font-size:.85rem;min-height:1.2rem;line-height:1.2rem}
.who{font-size:.85rem}
.home .btn.pri{margin-top:calc(var(--lh)*.5);min-height:3.25rem;font-size:1.35rem}
.foot{margin-top:calc(var(--lh)*.25);font-size:.82rem;line-height:1.45;max-width:40ch}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-family:var(--print);font-weight:600}
.code{font:700 1.5rem/1 var(--print);letter-spacing:.25em;color:var(--ink);padding:.3rem .2rem .3rem .5rem;border:1.75px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.lobby{display:flex;flex-direction:column;gap:.35rem;padding-bottom:calc(var(--lh) + env(safe-area-inset-bottom))}
.lrow{display:flex;align-items:center;gap:.6rem;min-height:var(--lh)}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--hand);font-size:1.15rem}
.lrow .nm.me{color:var(--ink);font-weight:700}
.btn.red{color:var(--red);border-color:var(--red)}
.conn{font-weight:600;white-space:nowrap;margin-right:.2rem}

/* game: header */
.hd{display:grid;grid-template-columns:1fr auto auto;align-items:center;column-gap:.4rem;min-height:calc(var(--lh)*2);padding:2px 0;flex:none}
.rd{min-width:0}
.rd .ink{font-size:1.45rem;font-weight:700;line-height:1.1;white-space:nowrap}
.rd .ink .pr{font-size:.78rem;font-weight:400}
.rd .pr{display:block}
.cutb{display:flex;align-items:center;gap:.35rem;padding:0 .2rem}
.cutb .cs{font-size:2.7rem;line-height:1;font-family:var(--print);color:var(--graphite)}
.cutb.r .cs{color:var(--red)}
.cutb .pr{max-width:4.2rem}
.tools{display:flex}

/* ledger */
.lg{flex:none;display:grid;grid-template-columns:1fr;margin-bottom:0}
.lg.two{grid-template-columns:1fr 1fr;column-gap:1.2rem}
.lh{height:var(--lh);display:grid;grid-template-columns:1rem 1.4rem 1fr 6.2rem 2.4rem;align-items:end;padding-bottom:3px;font-size:.7rem;letter-spacing:.02em}
.lh span:last-child,.lr .tt{text-align:right}
.lr{position:relative;height:var(--lh);display:grid;grid-template-columns:1rem 1.4rem 1fr 6.2rem 2.4rem;align-items:center;column-gap:.15rem;min-width:0}
.lg.two .lr{grid-template-columns:.8rem 1.25rem minmax(0,1fr) auto 1.7rem}
.ord{display:inline-flex;align-items:center;justify-content:center;width:1.1rem;height:1.1rem;border-radius:50%;border:1.25px solid var(--pencil);color:var(--pencil);font:600 .66rem/1 var(--print)}
.ord.f{border-color:var(--ink);background:var(--ink);color:var(--page)}
.ord.l{border-color:var(--red);color:var(--red)}
.of .mk{color:var(--ink);font-weight:700}
.of.bust .mk,.of.bust b{color:var(--red)}
.lg.two .lr .of{font-size:1rem}
.lr .arw{width:1rem;height:1rem;color:var(--red);visibility:hidden}
.lr.turn .arw{visibility:visible}
.lr .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--hand);font-size:1.12rem;color:var(--graphite)}
.lr .nm .hlw{padding:0 .15rem;border-radius:3px}
.lr.turn .nm .hlw{background:linear-gradient(100deg,transparent 2%,var(--hl) 6%,var(--hl) 94%,transparent 98%);animation:hl .35s ease-out both}
@keyframes hl{from{background-size:0 100%;background-repeat:no-repeat}to{background-size:100% 100%;background-repeat:no-repeat}}
.lr.me .nm{color:var(--ink);font-weight:700}
.lr .nm i{font-family:var(--print);font-style:normal;font-size:.68rem;color:var(--pencil);margin-left:.3rem}
.lr.away .nm .hlw{opacity:.55}
.lr .nm i.aw{color:var(--red)}
.tl{display:flex;align-items:center;gap:.3rem;min-width:0;justify-content:flex-end}
.tally{height:20px;color:var(--ink);flex:none}
.of{position:relative;font-family:var(--hand);font-size:1.1rem;color:var(--graphite);white-space:nowrap}
.of b{position:relative;display:inline-block;min-width:.8rem;text-align:center;color:var(--ink)}
.of b svg{position:absolute;left:50%;top:50%;width:1.45rem;height:1.5rem;transform:translate(-50%,-52%);color:var(--ink);overflow:visible}
.of.bust b{color:var(--red)} .of.bust b svg{color:var(--red)}
.of.none{color:var(--pencil)}
.lr .tt{font-family:var(--hand);font-size:1.1rem;color:var(--graphite)}
.write{animation:write .5s cubic-bezier(.3,.7,.2,1) both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* pen strokes */
.pen path,.pen line,.pen polyline{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.draw path,.draw line,.draw polyline,path.draw,line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:pen .45s cubic-bezier(.4,.1,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes pen{to{stroke-dashoffset:0}}

/* table */
.table{position:relative;flex:1 1 0;min-height:7rem;padding-top:1.3rem;display:flex;align-items:center;justify-content:center}
.slots{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;row-gap:calc(var(--lh)*.9)}
.slot{position:relative;display:flex;flex-direction:column;align-items:center}
.slot .sn{padding:0 2px;font-family:var(--hand);font-size:.95rem;line-height:1.3;color:var(--graphite);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.2rem}
.slot.me .sn{color:var(--ink);font-weight:700}
.slot.win .sn{color:var(--ink);font-weight:700}
.slot .tg{position:absolute;top:-1.35rem;left:50%;transform:translateX(-50%) rotate(-4deg);font-family:var(--hand);font-size:.9rem;line-height:1.2;white-space:nowrap;color:var(--pencil)}
.slot .tg.cut{color:var(--red);font-weight:700}
.slot .circ{position:absolute;pointer-events:none;color:var(--ink);overflow:visible;z-index:3}
.empty{border:1.5px dashed var(--rule);border-radius:8px}
.empty.now{border-color:var(--ink);border-style:dashed;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{border-color:var(--ink-soft)}}
.calc{text-align:center;padding:0 .3rem}
.calc .big{font-family:var(--hand);font-weight:700;color:var(--ink);font-size:1.6rem;line-height:calc(var(--lh)*1.5)}
.calc .big .cs{font-family:var(--print);font-weight:500}
.calc .big .cs.r{color:var(--red)}
.calc .sum{font-family:var(--hand);font-size:1.25rem;color:var(--graphite);line-height:var(--lh)}
.calc .sum b{color:var(--ink);position:relative}
.calc .left{margin-top:.2rem;font-size:.9rem}
.calc .left.over{color:var(--red)}

/* cards */
.card{position:relative;flex:none;background:var(--card);color:var(--card-ink);border:1px solid var(--card-line);border-radius:7px;box-shadow:var(--shadow);
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--print);font-weight:600;user-select:none;-webkit-user-select:none;transform:rotate(var(--r,0deg))}
.card.rd{color:var(--card-red)}

        this.pushChat(null, '', what + '. ' + t.name + ' takes the seat', true);
      } else {
        this.becomeBot(t, kicked ? 'kicked' : 'left');
        this.pushChat(null, '', what + '. A bot plays the seat', true);
      }
    }
    if (this.hostId === t.id) this.reassignHost(took ? t.id : undefined);
    this.onKick(token, kicked);
    if (!this.humans().length && !this.voyeurs.length) this.closed = true;
    this.emit();
  };

  // keepBots: bots from the game before, reused (so "Play again" keeps the same table)
  Game.prototype.begin = function (keepBots) {
    var humans = this.humans();
    var n = Math.max(this.size, humans.length);
    var want = n - humans.length;
    var bots = (keepBots || []).slice(0, want);
    var used = {};
    humans.concat(bots).forEach(function (p) { used[p.name.toLowerCase()] = 1; });
    var pool = shuffle(BOT_NAMES.slice()).filter(function (x) { return !used[x.toLowerCase()]; });
    var kept = bots.length;
    for (var i = kept; i < want; i++) {
      bots.push({ id: this.nextId++, name: pool[i - kept] || ('Bot ' + (i + 1)), bot: true, token: null, connected: true, score: 0, call: null, made: 0, hand: [] });
    }
    this.players = shuffle(humans.concat(bots));
    this.players.forEach(function (p) { p.score = 0; });
    this.n = n;
    this.per = Math.floor(52 / n);
    this.removedCount = 52 - n * this.per;
    this.first0 = rnd(n);
    this.history = [];
    this.winners = [];
    this.startRound(0);
  };

  Game.prototype.startRound = function (i) {
    var n = this.n, cards = this.per - i;
    var d = shuffle(newDeck());
    this.players.forEach(function (p, k) {
      p.hand = sortHand(d.slice(k * cards, (k + 1) * cards));
      p.call = null; p.made = 0;
    });
    var first = (this.first0 + i) % n;
    this.round = { i: i, cards: cards, cut: CUT_ORDER[i % 5], first: first };
    this.phase = 'calling';
    this.turnIdx = first;
    this.trick = []; this.led = null; this.trickWinner = null;
    this.played = [];
    this.roundTricks = [];
    this.emit();
  };

  Game.prototype.callState = function () {
    var called = this.players.filter(function (p) { return p.call !== null; });
    var sum = called.reduce(function (s, p) { return s + p.call; }, 0);
    var isLast = called.length === this.n - 1;
    var forbidden = isLast ? this.round.cards - sum : null;
    if (forbidden !== null && (forbidden < 0 || forbidden > this.round.cards)) forbidden = null;
    return { sum: sum, isLast: isLast, forbidden: forbidden };
  };

  Game.prototype.doCall = function (p, num) {
    if (this.phase !== 'calling' || this.players[this.turnIdx].id !== p.id) return { err: 'Not your turn' };
    var v = parseInt(num, 10);
    if (isNaN(v) || v < 0 || v > this.round.cards) return { err: 'Call between 0 and ' + this.round.cards };
    var cs = this.callState();
    if (cs.forbidden === v) return { err: "Last caller can't make the calls total " + this.round.cards };
    p.call = v;
    if (this.players.every(function (x) { return x.call !== null; })) {
      this.phase = 'playing';
      this.turnIdx = this.round.first;
    } else {
      this.turnIdx = (this.turnIdx + 1) % this.n;
    }
    this.emit();
    return { ok: true };
  };

  Game.prototype.doPlay = function (p, card) {
    if (this.phase !== 'playing' || this.players[this.turnIdx].id !== p.id) return { err: 'Not your turn' };
    if (p.hand.indexOf(card) < 0) return { err: 'You do not hold that card' };
    if (legalCards(p.hand, this.led).indexOf(card) < 0) return { err: 'You must follow the led suit' };
    p.hand = p.hand.filter(function (c) { return c !== card; });
    if (!this.trick.length) this.led = suitOf(card);
    this.trick.push({ pid: p.id, card: card });
    this.played.push(card);
    if (this.trick.length < this.n) {
      this.turnIdx = (this.turnIdx + 1) % this.n;
      this.emit();
      return { ok: true };
    }
    var wid = trickWinner(this.trick, this.round.cut);
    var w = this.byId(wid);
    w.made++;
    this.trickWinner = wid;
    this.roundTricks.push({ trick: this.trick.map(function (t) { return { pid: t.pid, card: t.card }; }), winner: wid });
    this.phase = 'trickdone';
    this.turnIdx = this.players.indexOf(w);
    this.emit();
    var self = this;
    // Every hand: once everyone has played, the table stays for handHoldMs (4 s) so the cards can be read, then play
    // moves on (the next hand, or the Screen after the round's last hand).
    clearTimeout(this.ttimer);
    this.ttimer = setTimeout(function () { self.afterTrick(); }, this.handHoldMs);
    return { ok: true };
  };

  Game.prototype.afterTrick = function () {
    if (this.phase !== 'trickdone') return;
    if (this.players[0].hand.length === 0) { this.endRound(); return; }
    this.trick = []; this.led = null; this.trickWinner = null;
    this.phase = 'playing';
    this.emit();
  };

  Game.prototype.endRound = function () {
    var res = {};
    this.players.forEach(function (p) {
      var pts = p.made === p.call ? 10 + p.call : 0;
      p.score += pts;
      res[p.id] = { call: p.call, made: p.made, pts: pts };
    });
    // every hand of the round is kept with it, for the Hands won tab on the Screen
    this.history.push({ i: this.round.i, cards: this.round.cards, cut: this.round.cut, res: res, tricks: this.roundTricks });
    this.trick = []; this.led = null; this.trickWinner = null;
    if (this.round.i >= this.per - 1) {
      var max = Math.max.apply(null, this.players.map(function (p) { return p.score; }));
      this.winners = this.players.filter(function (p) { return p.score === max; }).map(function (p) { return p.id; });
      this.phase = 'gameover';
      this.overAt = Date.now();
    } else {
      this.phase = 'roundover';
    }
    this.emit();
  };

  // Arms one timer per turn. Chat, renames etc. call emit() too, so the timer is only
  // re-armed when the turn itself (or who is acting, or the timer setting) changes.
  Game.prototype.schedule = function () {
    var live = this.phase === 'calling' || this.phase === 'playing';
    var cur = live ? this.players[this.turnIdx] : null;
    if (!cur) {
      clearTimeout(this.timer); this.timer = null; this.schedKey = null; this.turnEnd = null;
      return;
    }
    var key = [this.phase, this.round.i, this.turnIdx, this.trick.length, cur.id, cur.bot ? 1 : 0, cur.connected ? 1 : 0, this.timerSec].join('|');
    if (key === this.schedKey && this.timer) return;
    clearTimeout(this.timer); this.timer = null;
    this.schedKey = key; this.turnEnd = null;
    var delay, timed = false, away = false;
    if (cur.bot) delay = this.fast ? 1 : 600 + rnd(500);
    else if (!cur.connected) { delay = this.fast ? 1 : (this.autoMs || 90000); away = true; }
    else if (this.timerSec) { delay = this.timerSec * 1000 * this.timerScale; timed = true; }
    else return;
    if (timed) this.turnEnd = Date.now() + delay;
    var self = this;
    this.timer = setTimeout(function () {
      self.timer = null; self.schedKey = null;
      if (timed && self.players[self.turnIdx] === cur && !cur.bot) {
        self.pushChat(null, '', 'Time’s up for ' + cur.name + ' — played automatically', true);
      }
      var played = self.botAct(cur.id);
      // an absent player's auto-played turns are counted: awayLimit in a row hands the seat to a bot
      if (played && away && !cur.bot && !cur.connected) self.noteAway(cur);
    }, delay);
  };

  Game.prototype.botAct = function (pid) {
    var cur = this.players[this.turnIdx];
    if (!cur || cur.id !== pid) return false;
    var r = null;
    // a human whose time ran out (or who is away) is played for at Medium, whatever the bot level is
    var level = cur.bot ? (cur.level || this.botLevel) : 'medium';
    if (this.phase === 'calling') {
      var cs = this.callState();
      var k = this.players.filter(function (p) { return p.call !== null; }).length;
      var n = Bot.call(cur.hand, this.round.cut, this.n, this.round.cards, cs.sum, cs.isLast, level, { k: k });
      r = this.doCall(cur, n);
    } else if (this.phase === 'playing') {
      var c = Bot.play(cur.hand, this.led, this.trick, this.round.cut, cur.call - cur.made, level, { n: this.n, played: this.played });
      r = this.doPlay(cur, c);
    }
    return !!(r && r.ok);
  };

  Game.prototype.destroy = function () {
    clearTimeout(this.timer); clearTimeout(this.ttimer);
  };

  // The hands this player has won, round by round (the round under way last, with hands so far)
  Game.prototype.winsFor = function (pid) {
    var out = [], p = this.byId(pid);
    this.history.forEach(function (h) {
      var r = h.res[pid] || { call: 0, made: 0, pts: 0 };
      out.push({ i: h.i, cards: h.cards, cut: h.cut, done: true, call: r.call, made: r.made, pts: r.pts,
        hands: (h.tricks || []).filter(function (t) { return t.winner === pid; }) });
    });
    if (this.round && this.round.i >= this.history.length && this.phase !== 'lobby' && this.phase !== 'gameover') {
      out.push({ i: this.round.i, cards: this.round.cards, cut: this.round.cut, done: false, call: p ? p.call : null, made: p ? p.made : 0, pts: 0,
        hands: this.roundTricks.filter(function (t) { return t.winner === pid; }) });
    }
    return out;
  };

  Game.prototype.snapshot = function (pid) {
    var me = this.byId(pid), vy = me ? null : this.voyeurById(pid);
    var inGame = this.phase !== 'lobby';
    var humans = this.humans();
    var n = inGame ? this.n : Math.max(this.size, humans.length);
    var per = Math.floor(52 / n);
    var turn = (this.phase === 'calling' || this.phase === 'playing' || this.phase === 'trickdone') && this.players[this.turnIdx]
      ? this.players[this.turnIdx].id : null;
    var s = {
      code: this.code, phase: this.phase, me: pid, host: this.hostId,
      size: this.size, n: n, per: per, removed: 52 - n * per,
      botCount: inGame ? this.players.filter(function (p) { return p.bot; }).length : n - humans.length,
      players: this.players.map(function (p) {
        return { id: p.id, name: p.name, bot: p.bot, connected: p.connected, call: p.call, made: p.made, score: p.score, ex: !!p.ex };
      }),
      voyeur: !!vy, meName: me ? me.name : (vy ? vy.name : ''),
      voyeurs: this.voyeurs.map(function (v) {
        return { id: v.id, name: v.name, connected: v.connected, peek: v.peek ? { pid: v.peek.pid, state: v.peek.state } : null };
      }),
      // the score lines only; every hand of every round stays on the server and is sent as `wins` (the player's own)
      history: this.history.map(function (h) { return { i: h.i, cards: h.cards, cut: h.cut, res: h.res }; }),
      againIn: this.phase === 'gameover' ? Math.max(0, this.overAt + this.againDelayMs - Date.now()) : null,
      wins: null,
      round: this.round, turn: turn, led: this.led,
      trick: this.trick, trickWinner: this.trickWinner, winners: this.winners,
      hand: me && inGame ? me.hand : [], legal: [], callInfo: null,
      timerSec: this.timerSec, botLevel: this.botLevel, seq: this.seq,
      turnLeft: this.turnEnd && (this.phase === 'calling' || this.phase === 'playing') ? Math.max(0, this.turnEnd - Date.now()) : null,
      chat: this.chat.slice(-50)
    };
    if (me && this.phase === 'playing' && turn === pid) s.legal = legalCards(me.hand, this.led);
    if (me && this.phase === 'calling' && turn === pid) s.callInfo = this.callState();
    // Hands won: the player's own, every round. A voyeur gets them for the player whose hand they may see.
    var wt = me || (vy && vy.peek && vy.peek.state === 'ok' ? this.byId(vy.peek.pid) : null);
    if (wt && inGame) s.wins = this.winsFor(wt.id);
    if (vy) {
      // A voyeur sees the table. A hand only comes with it once that player has said yes.
      s.peek = null;
      if (vy.peek) {
        var tp = this.byId(vy.peek.pid);
        if (tp) {
          s.peek = { pid: tp.id, name: tp.name, state: vy.peek.state };
          if (vy.peek.state === 'ok' && inGame) s.hand = tp.hand;
        }
      }
    }
    return s;
  };

  return {
    Game: Game, Bot: Bot, SUITS: SUITS, SUIT_NAME: SUIT_NAME, CUT_ORDER: CUT_ORDER,
    suitOf: suitOf, rankOf: rankOf, legalCards: legalCards, trickWinner: trickWinner,
    newDeck: newDeck, shuffle: shuffle, cleanName: cleanName
  };
});

function tableLayout(n,W,avail){

  });
  // nothing fits comfortably: shrink the cards to what the height really allows (down to 20px wide)
  if(!best){var rows=n>4?2:1,per=Math.ceil(n/rows);var byH2=Math.floor(((avail-(rows-1)*26-4)/rows-24)/1.4);var tw=Math.max(20,Math.min(Math.floor((W-8)/per)-10,byH2,40));best={rows:rows,per:per,tw:tw,th:Math.round(tw*1.4)}}

}

  app.className='game'+(onScreen?' sc':'');
  var cs=getComputedStyle(app),W=Math.max(240,app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight));
  if(wideLayout()&&!onScreen)W=Math.max(240,(W-1.2*rootPx())/2);   // landscape: the hand has the right-hand column
  if(s.phase==='roundover'&&!scHidden){
    var lr=s.history[s.history.length-1];
    app.innerHTML=headerHTML()+'<section class="insc" aria-label="The Screen"><h2 class="ink">The Screen <span class="pr">after round '+(lr.i+1)+'</span><button class="btn sm" data-a="hidesc" style="margin-left:auto">Hide</button></h2>'+screenTabsHTML()+screenBodyHTML()+roundSummary()+dealHTML(lr)+'</section>';
    var sw=app.querySelector('#scw'),lrow=sw&&sw.querySelector('#lastrow');if(lrow)sw.scrollTop=Math.max(0,lrow.offsetTop-sw.clientHeight*.55);
  }else{
  app.innerHTML=headerHTML()+ledgerHTML()+'<div class="table" id="tbl"></div><div class="dock">'+voyeurBarHTML()+padHTML()+handHTML(W)+playbarHTML()+'</div>';
  fillTable();
  fitCheck();
  }
  buzz(s);
  s.players.forEach(function(p){anim.made[p.id]=p.made;anim.calls[p.id]=p.call});
}

var lastBuzz='';
function buzz(s){
  var key='',mine=s.turn===s.me&&(s.phase==='calling'||s.phase==='playing');
  if(mine)key='t'+s.round.i+':'+s.phase+':'+s.hand.length;
  else if(s.phase==='trickdone'&&s.trickWinner===s.me)key='w'+s.round.i+':'+s.hand.length;
  if(!key||key===lastBuzz)return;lastBuzz=key;
  // browsers refuse vibration until the person has tapped the page once
  var ua=navigator.userActivation;if(ua&&!ua.hasBeenActive)return;
  try{if(navigator.vibrate)navigator.vibrate(key[0]==='t'?[18]:[12,60,12])}catch(x){}
}
/* ---------- sheets ---------- */
function screenHTML(full){
  var s=snap,hist=s.history,live=s.phase==='calling'||s.phase==='playing'||s.phase==='trickdone';
  var h='<div class="sc-wrap" id="scw"><table class="sc'+(s.players.length>=6?' many':'')+'"><thead><tr><th></th>';
  s.players.forEach(function(p){h+='<th class="'+(p.id===s.me?'me':'')+'">'+esc(p.id===s.me?'You':p.name)+'</th>'});
  h+='</tr></thead><tbody>';
  for(var i=0;i<s.per;i++){
    var cards=s.per-i,cut=E.CUT_ORDER[i%5];
    var lab=cards+' '+(cut?'<span class="'+(isRed(cut)?'r':'')+'">'+SY[cut]+'</span>':'·');
    if(i<hist.length){
      var drawRow=i===hist.length-1&&!anim.rows[i];
      h+='<tr'+(i===hist.length-1?' id="lastrow"':'')+'><th>'+lab+'</th>';
      s.players.forEach(function(p,k){
        var x=hist[i].res[p.id],won=x.made===x.call,d=drawRow?(.25+k*.14):null;
        h+='<td><span class="cell'+(won?'':' miss')+'"><span class="cv">'+x.call
          +(won?'':strikeSVG(drawRow?'draw':'',d))+'</span>'
          +(won?'<b class="pts'+(drawRow?' write':'')+'"'+(drawRow?' style="animation-delay:'+d+'s"':'')+'>'+x.pts+'</b>':'<sup>'+x.made+'</sup>')+'</span></td>';
      });
      h+='</tr>';
      if(drawRow)anim.rows[i]=true;
    }else if(live&&i===s.round.i){
      h+='<tr class="now" id="lastrow"><th>'+lab+'</th>';
      s.players.forEach(function(p){h+='<td>'+(p.call===null?'<span class="pr">…</span>':'<span class="cell">'+p.made+' of '+p.call+'</span>')+'</td>'});
      h+='</tr>';
    }else{
      h+='<tr class="fut"><th>'+lab+'</th>';
      s.players.forEach(function(){h+='<td></td>'});
      h+='</tr>';
    }
  }
  h+='</tbody><tfoot><tr><th>Total</th>';
  s.players.forEach(function(p){h+='<td>'+p.score+'</td>'});
  return h+'</tr></tfoot></table></div>';
}

  return '<div class="chips tabs" role="tablist" aria-label="Screen view">'
   +'<button class="chip'+(hw?'':' on')+'" role="tab" data-a="stab" data-v="scores" aria-selected="'+(!hw)+'">Scores</button>'

}
function screenBodyHTML(){return screenTab==='hands'&&Array.isArray(snap.wins)?handsWonHTML():screenHTML()}
function handsWonHTML(){
  var s=snap,rounds=s.wins.slice().sort(function(a,b){return b.i-a.i}),n=s.players.length,W=Math.min(innerWidth,480)-56;
  var tw=Math.max(24,Math.min(44,Math.floor(W/n)-6)),th=Math.round(tw*1.4);
  var who=s.voyeur&&s.peek?s.peek.name:'You',total=rounds.reduce(function(a,r){return a+r.hands.length},0);
  if(!rounds.length)return '<div class="hwon"><p class="pr">No hands won yet.</p></div>';
  var h='<div class="hwon"><div class="pr">'+(s.voyeur?esc(who)+'’s hands, ':'Your hands, ')+'every round, newest first · '+total+' won so far</div>';
  rounds.forEach(function(r){
    var cut=r.cut?'<span class="sy'+(isRed(r.cut)?' r':'')+'">'+SY[r.cut]+'</span> ':'';
    var tag=r.done?(r.made+' of '+r.call+(r.made===r.call?' · +'+r.pts:'')):(r.call===null?'calling':r.made+' of '+r.call+' so far');
    h+='<section class="hw-r"><h4 class="ink">Round '+(r.i+1)+' <span class="pr">'+cut+r.cards+' card'+(r.cards>1?'s':'')+' · '+tag+'</span></h4>';

function roundSummary(){
  var s=snap,last=s.history[s.history.length-1],x=last.res[s.me];
  var made=s.players.filter(function(p){return last.res[p.id].made===last.res[p.id].call}).map(function(p){return p.id===s.me?'you':p.name});
  var mine=!x?'':x.made===x.call?'You made your '+x.call+': <b>+'+x.pts+'</b>.':'<span class="miss">You called '+x.call+' and made '+x.made+': nothing this round.</span>';
  return '<div class="sumline">'+mine+' '+(made.length?'Made it: '+esc(made.join(', '))+'.':'Nobody made their call!')+'</div>';
}

  try{
    if(sheet&&!sheetPushed){history.pushState({jn:1},'');sheetPushed=true}
    else if(!sheet&&sheetPushed){sheetPushed=false;ignorePop=true;setTimeout(function(){ignorePop=false},700);history.back()}
  }catch(e){sheetPushed=false;ignorePop=false}

});

function rulesHTML(){
  return '<h3>The idea</h3><p>Before each round, call how many hands you will win. Make exactly that many to score. One more or one less and the round scores nothing.</p>'
  +'<h3>Rounds</h3><ul><li>3 to 8 players. The deck is dealt out evenly; leftover cards are set aside.</li><li>Round 1 has the most cards. Each round deals one fewer, down to one card.</li></ul>'
  +'<h3>Calling</h3><ul><li>Calls go round the table, and you see every call before yours.</li><li>Any number is allowed, 0 included. The last caller can’t make the calls add up to the cards in the round.</li></ul>'
  +'<h3>Playing a hand</h3><ul><li>Flick a card up to play it, or tap a card to pick it and press Play. Tap it again to put it back.</li><li>Follow the led suit if you can. Ace is high. The highest card of the led suit wins the hand, and the winner leads next.</li></ul>'
  +'<h3>The cut</h3><ul><li>The cut suit rotates: Spades, Hearts, Clubs, Diamonds, then no cut.</li><li>With none of the led suit, play anything. A cut card beats the led suit; a higher cut beats a lower one.</li></ul>'
  +'<h3>Scoring</h3><ul><li>Make your call exactly: 10 plus your call. Call 0 and win nothing: 10.</li><li>Miss: 0. On the Screen, a made call shows its points in bold; a missed call is struck out with the hands actually made beside it.</li></ul>';
}
// After the game the final scores stay up: Play again and Game setup wait `againIn` (30 s, set by the server)

},250);

/* ---------- input ---------- */
function playCard(c){sel=null;act({type:'play',card:c})}
function tapCard(c){sel=(sel===c)?null:c;render()}
var drag=null;
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.hand .card.ok');if(!el)return;
  drag={el:el,c:el.dataset.c,x0:e.clientX,y0:e.clientY,dy:0,moved:false,id:e.pointerId,pts:[{y:e.clientY,t:e.timeStamp}]};
  try{el.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dy=e.clientY-drag.y0,dx=e.clientX-drag.x0;
  if(!drag.moved&&Math.abs(dy)<6&&Math.abs(dx)<6)return;
  drag.moved=true;drag.dy=dy;drag.pts.push({y:e.clientY,t:e.timeStamp});if(drag.pts.length>8)drag.pts.shift();
  drag.el.classList.add('dragging');
  drag.el.style.transform='translate('+dx+'px,'+(Math.min(0,dy)-10)+'px) rotate('+(dx*.05)+'deg)';
});
document.addEventListener('pointerup',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var d=drag;drag=null;
  if(!d.moved){tapCard(d.c);return}
  var p0=d.pts.filter(function(p){return e.timeStamp-p.t<=90})[0]||d.pts[0],vy=(e.clientY-p0.y)/Math.max(1,e.timeStamp-p0.t);
  if(d.dy<-50||(d.dy<-14&&vy<-.5))playCard(d.c);
  else{d.el.classList.remove('dragging');d.el.style.transform=''}
});
document.addEventListener('pointercancel',function(){if(drag){drag.el.classList.remove('dragging');drag.el.style.transform='';drag=null}});
document.addEventListener('click',function(e){
  // keyboard activation of hand cards (pointer taps are handled above)
  var hc=e.target.closest('.hand .card.ok');
  if(hc){if(e.detail===0)tapCard(hc.dataset.c);return}
  var t=e.target.closest('[data-a]');
  if(!t)return;
  if(t.classList.contains('scrim')&&e.target!==t)return;
  var a=t.dataset.a,v=t.dataset.v;
  switch(a){
    case 'start':create();break;
    case 'join':join();break;
    case 'lstart':act({type:'start'});break;
    case 'lsize':act({type:'size',size:snap.n+(+t.dataset.d)});setTimeout(renderSheet,60);break;
    case 'copy':shareInvite();break;
    case 'kickask':pendingKick=+t.dataset.p;render();break;
    case 'kickno':pendingKick=null;render();break;
    case 'kickyes':{
      var kp=+t.dataset.p;pendingKick=null;
      // in a game with voyeurs watching, the host also picks who takes the removed player's seat
      if(snap&&snap.phase!=='lobby'&&liveVoyeurs().length){handover={kind:'kick',pid:kp};sheet='handover';render();break}
      act({type:'kick',pid:kp});render();toast('Player removed');break;
    }
    case 'hand':{
      var ho=handover,hto=v===''?null:+v;handover=null;sheet=null;
      if(ho&&ho.kind==='kick'){act({type:'kick',pid:ho.pid,to:hto});render();toast('Player removed')}
      else if(ho)leave(hto);
      break;
    }
    case 'claim':claimSeat();break;
    case 'watch':watchRoom();break;
    case 'offerpeek':if(joinOffer){joinOffer.peek=v===''?null:+v;render()}break;
    case 'offerno':joinOffer=null;render();break;
    case 'stab':screenTab=(v==='hands')?'hands':'scores';render();break;
    case 'peeksheet':sheet='peek';renderSheet();break;
    case 'peek':act({type:'peek',pid:v===''?null:+v});sheet=null;render();break;
    case 'peekyes':act({type:'peekreply',vid:+v,ok:true});break;
    case 'peekno':act({type:'peekreply',vid:+v,ok:false});break;
    case 'seatask':seatPick=+v;sheet='seat';renderSheet();break;
    case 'seat':{var sp=seatPick;seatPick=null;sheet=null;act({type:'seat',vid:sp,pid:+v});render();break}
    case 'rename':{var rv=($('#rn')||{}).value;rv=(rv||'').trim();if(!rv){toast('Write a name first');break}setup.name=rv;save('jn_setup',setup);act({type:'rename',name:rv});toast('Name saved');break}
    case 'layout':ui.layout=(v==='scroll')?'scroll':'fit';autoScroll=false;applyUI();render();break;
    case 'redeal':{var nmv=($('#nm')||{}).value;firstHome=true;render();if(nmv!=null&&$('#nm'))$('#nm').value=nmv;break}
    case 'hidesc':scHidden=true;render();break;
    case 'showsc':scHidden=false;render();break;
    case 'size':setup.size=+v;keepName();save('jn_setup',setup);render();break;
    case 'level':setup.level=v;keepName();save('jn_setup',setup);render();break;
    case 'timer':setup.timer=+v;keepName();save('jn_setup',setup);render();break;
    case 'call':act({type:'call',n:+t.dataset.n});break;
    case 'nope':toast('Calls can’t add up to '+snap.round.cards+', so pick another number');break;
    case 'screen':sheet='screen';screenTab='scores';$('#sheet').innerHTML='';renderSheet();break;
    case 'chat':sheet='chat';chatSeen=lastId(snap);$('#pop').innerHTML='';render();var ci=$('#cin');if(ci&&matchMedia('(pointer:fine)').matches)ci.focus();break;
    case 'settings':case 'menu':case 'table':sheet='settings';pendingKick=null;renderSheet();break;
    case 'ink':ui.ink=v;applyUI();renderSheet();break;
    case 'autostart':create(true);break;
    case 'submit':if(sel)playCard(sel);break;
    case 'rules':sheet='rules';renderSheet();break;
    case 'close':sheet=null;render();break;
    case 'next':scHidden=false;act({type:'next'});break;
    case 'quick':sendChat(v);break;
    case 'theme':ui.theme=v;applyUI();renderSheet();break;
    case 'fs':ui.fs=+v;setAppH();applyUI();render();break;
    case 'glevel':act({type:'level',level:v});setTimeout(renderSheet,60);break;
    case 'gtimer':act({type:'timer',sec:+v});setTimeout(renderSheet,60);break;
    case 'again':sheet=null;if(isLocal&&game&&game.code==='DEMO')startGame();else act({type:'again'});break;
    case 'setup':sheet=null;act({type:'setup'});break;
    case 'home':askLeave();break;
  }
});
function keepName(){var i=$('#nm');if(i)setup.name=i.value.trim()}
function sendChat(text){
  text=String(text||'').trim();if(!text||!snap)return;
  if(isLocal&&game){var p=game.byId(me);if(p)p.lastChat=0}
  act({type:'chat',text:text});
  if(isLocal&&Math.random()<.7)friendSays(null,1300);
}
document.addEventListener('submit',function(e){
  if(e.target.id!=='cform')return;e.preventDefault();
  var i=$('#cin'),v=i.value;i.value='';sendChat(v);setTimeout(function(){var j=$('#cin');if(j)j.focus()},0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='nm'){e.preventDefault();create()}
  if(e.key==='Enter'&&e.target.id==='rc'){e.preventDefault();join()}
  if(e.key==='Escape'&&sheet){sheet=null;render()}
});
var rsT=null;
// On phones the on-screen keyboard shrinks the window height. Redrawing then would replace the text box
// being typed in and close the keyboard, so only redraw when the width changes (rotation, desktop resize),
// or on a height change while nothing is being typed.
var lastW=innerWidth;
function typing(){var a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')}
addEventListener('resize',function(){setAppH();clearTimeout(rsT);rsT=setTimeout(function(){
  var widthChanged=innerWidth!==lastW;lastW=innerWidth;
  if(snap&&$('#tbl'))fillTable();   // the table holds no text boxes, so it can always re-fit
  if(!widthChanged&&typing())return;
  if(snap)render();else{var nm=$('#nm'),v=nm&&nm.value,rc=$('#rc'),rv=rc&&rc.value;homeFw=null;renderHome();if(v!=null&&$('#nm'))$('#nm').value=v;if(rv!=null&&$('#rc'))$('#rc').value=rv}
},120)});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyUI);
// (these two used to sit inside the text-size button's handler, so they only existed after that button was tapped)
if(window.visualViewport)visualViewport.addEventListener('resize',function(){setAppH();if(snap&&$('#tbl'))fillTable()});
addEventListener('orientationchange',function(){setTimeout(function(){setAppH();if(snap)render()},250)});

applyUI();render();
if(sess&&!DEMO)tryRejoin();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(snap)render()});
window.__jn={get snap(){return snap},game:function(){return game},st:function(){return{seq:seq,conn:conn,poll:!!pollT}},act:act,wake:wake,forceH:function(px){appHForce=px;setAppH();if(snap)render()}};
})();
</script>
</body>
</html>
