<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFE3">
<title>Judgement Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Kalam:wght@400;700&display=block" rel="stylesheet">
<style>
:root{
  --page:#F4F0E4;--desk:#DCD5C3;--rule:#C3D3E8;--margin:#E2A49C;
  --ink:#1F3A9A;--ink-soft:rgba(31,58,154,.12);--red:#C2281C;--graphite:#2C2B28;--pencil:#66645E;
  --hl:rgba(255,214,0,.55);--sticky:#FBE88A;--sticky-ink:#3A3110;
  --card:#FFFDF7;--card-ink:#1B1B1B;--card-red:#C0281C;--card-line:#D8D0BC;
  --shadow:0 1px 2px rgba(40,30,10,.18),0 6px 14px rgba(40,30,10,.10);
  --hand:'Kalam','Hind',system-ui,sans-serif;--print:'Hind',system-ui,sans-serif;
  --lh:1.75rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="paper"]):not([data-theme="light"]){
    --page:#18181B;--desk:#0E0E10;--rule:#2A3142;--margin:#5E2C2C;
    --ink:#9DB8FF;--ink-soft:rgba(157,184,255,.14);--red:#FF7A6B;--graphite:#ECE8DD;--pencil:#A4A29B;
    --hl:rgba(196,255,64,.22);--sticky:#3D3820;--sticky-ink:#F4EBC0;
    --card:#F2EEE3;--card-line:#3A3A40;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="black"],:root[data-theme="dark"],:root[data-theme="chalk"],:root[data-theme="midnight"]{
  --page:#18181B;--desk:#0E0E10;--rule:#2A3142;--margin:#5E2C2C;
  --ink:#9DB8FF;--ink-soft:rgba(157,184,255,.14);--red:#FF7A6B;--graphite:#ECE8DD;--pencil:#A4A29B;
  --hl:rgba(196,255,64,.22);--sticky:#3D3820;--sticky-ink:#F4EBC0;
  --card:#F2EEE3;--card-line:#3A3A40;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-ink="black"]{--ink:#1E1E22;--ink-soft:rgba(30,30,34,.10)}
@media (prefers-color-scheme:dark){:root[data-ink="black"]:not([data-theme="paper"]):not([data-theme="light"]){--ink:#F2EEE6;--ink-soft:rgba(242,238,230,.14)}}
:root[data-ink="black"][data-theme="black"],:root[data-ink="black"][data-theme="dark"],:root[data-ink="black"][data-theme="chalk"],:root[data-ink="black"][data-theme="midnight"]{--ink:#F2EEE6;--ink-soft:rgba(242,238,230,.14)}
:root[data-ink="green"]{--ink:#1D6A43;--ink-soft:rgba(29,106,67,.12)}
@media (prefers-color-scheme:dark){:root[data-ink="green"]:not([data-theme="paper"]):not([data-theme="light"]){--ink:#86DDB0;--ink-soft:rgba(134,221,176,.14)}}
:root[data-ink="green"][data-theme="black"],:root[data-ink="green"][data-theme="dark"],:root[data-ink="green"][data-theme="chalk"],:root[data-ink="green"][data-theme="midnight"]{--ink:#86DDB0;--ink-soft:rgba(134,221,176,.14)}
:root[data-ink="purple"]{--ink:#5A2A98;--ink-soft:rgba(90,42,152,.12)}
@media (prefers-color-scheme:dark){:root[data-ink="purple"]:not([data-theme="paper"]):not([data-theme="light"]){--ink:#C9A8FF;--ink-soft:rgba(201,168,255,.15)}}
:root[data-ink="purple"][data-theme="black"],:root[data-ink="purple"][data-theme="dark"],:root[data-ink="purple"][data-theme="chalk"],:root[data-ink="purple"][data-theme="midnight"]{--ink:#C9A8FF;--ink-soft:rgba(201,168,255,.15)}
:root[data-ink="red"]{--ink:#A3241A;--ink-soft:rgba(163,36,26,.11)}
@media (prefers-color-scheme:dark){:root[data-ink="red"]:not([data-theme="paper"]):not([data-theme="light"]){--ink:#FF9A8C;--ink-soft:rgba(255,154,140,.15)}}
:root[data-ink="red"][data-theme="black"],:root[data-ink="red"][data-theme="dark"],:root[data-ink="red"][data-theme="chalk"],:root[data-ink="red"][data-theme="midnight"]{--ink:#FF9A8C;--ink-soft:rgba(255,154,140,.15)}
:root[data-theme="legal"],:root[data-theme="mint"],:root[data-theme="blush"],:root[data-theme="sky"],:root[data-theme="kraft"]{color-scheme:light}
:root[data-theme="legal"]{--page:#FBF1BE;--desk:#E6D78F;--rule:#A9C4DE;--margin:#E0877C}
:root[data-theme="mint"]{--page:#E6F3EA;--desk:#C9DFD0;--rule:#B4CFE0;--margin:#E39A93}
:root[data-theme="blush"]{--page:#FBE9E7;--desk:#EACFCB;--rule:#C9D3E8;--margin:#E08F86}
:root[data-theme="sky"]{--page:#E7EFF8;--desk:#CBD9EA;--rule:#A9C0DD;--margin:#E39A93}
:root[data-theme="kraft"]{--page:#DCC7A1;--desk:#BFA77C;--rule:#B7A57F;--margin:#B5534A;--pencil:#5A4E3A;--graphite:#241F17;--red:#8E1A12}
:root[data-theme="kraft"][data-ink="green"]{--ink:#134A2C;--ink-soft:rgba(19,74,44,.12)}
:root[data-theme="kraft"][data-ink="red"]{--ink:#7E1710;--ink-soft:rgba(126,23,16,.11)}
:root[data-theme="chalk"]{--page:#1E3A2C;--desk:#12261C;--rule:#2C5140;--margin:#7C4038;--graphite:#EEF2EA;--pencil:#A9BDB1}
:root[data-theme="midnight"]{--page:#131A30;--desk:#0A0F1E;--rule:#25304F;--margin:#5E2E3E;--graphite:#E8EAF2;--pencil:#9CA4BE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--desk);color:var(--graphite);font-family:var(--print);line-height:var(--lh);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:var(--page)}
input{caret-color:var(--ink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px dashed var(--ink);outline-offset:3px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
svg{display:block}
.ink{font-family:var(--hand);color:var(--ink)}
.pr{font-family:var(--print);color:var(--pencil);font-size:.82rem;line-height:1.2}
.red{color:var(--red)}

/* the page */
#app{position:relative;max-width:480px;margin:0 auto;min-height:100dvh;background-color:var(--page);
  background-image:
    linear-gradient(to right,transparent 26px,var(--margin) 26px,var(--margin) 27px,transparent 27px,transparent 30px,var(--margin) 30px,var(--margin) 31px,transparent 31px),
    linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));
  background-size:100% 100%,100% var(--lh);
  padding-block:0;padding-left:max(40px,calc(env(safe-area-inset-left,0px) + 24px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
@media (min-width:520px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 20px 50px rgba(0,0,0,.18)}}
#app.game{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;overflow:hidden}

/* buttons, drawn boxes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:.35rem 1.1rem;
  border:1.75px solid var(--ink);color:var(--ink);font-family:var(--hand);font-size:1.15rem;font-weight:700;
  border-radius:255px 14px 225px 14px/14px 225px 14px 255px;transition:transform .15s cubic-bezier(.2,.8,.2,1),background-color .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--page)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{width:100%}
.ib{width:2.5rem;height:2.5rem;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);position:relative;border-radius:50%}
.ib svg{width:1.4rem;height:1.4rem}
.ib:active{background:var(--ink-soft)}
.badge{position:absolute;top:.1rem;right:.05rem;min-width:1.1rem;height:1.1rem;padding:0 .25rem;border-radius:1rem;background:var(--red);color:#fff;font:600 .68rem/1.1rem var(--print);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{min-height:2.25rem;min-width:2.5rem;padding:0 .8rem;font-family:var(--hand);font-size:1.05rem;color:var(--ink);
  border:1.5px solid transparent;border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.chip:hover{border-color:var(--ink-soft)}
.chip.on{border-color:var(--ink);background:var(--ink-soft);font-weight:700}

/* home */
.home{flex:1 0 auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.hm{margin-block:auto;padding-block:calc(var(--lh)*.5)}
.vline{flex:none;height:18px;display:flex;align-items:flex-end;justify-content:center;font:500 13px/1 var(--print);color:var(--pencil);letter-spacing:.02em;white-space:nowrap}
.swatch{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;margin-right:.35rem;vertical-align:-.05rem}
.swatch.paper{border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.invite{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:calc(var(--lh)*.5) 0;text-align:center}
.code.big{font-size:2.3rem;padding:.5rem .6rem .5rem 1rem;letter-spacing:.35em}
.dot{flex:none;width:.55rem;height:.55rem;border-radius:50%;background:var(--rule)}
.dot.on{background:#3E9B5B}
.joined-now{animation:joinin .6s cubic-bezier(.2,.9,.3,1) both}
@keyframes joinin{from{opacity:0;transform:translateX(-12px)}}
.joined-now .nm{background:linear-gradient(100deg,transparent 2%,var(--hl) 6%,var(--hl) 94%,transparent 98%) no-repeat;background-size:100% 100%}
.wait{font-family:var(--hand);font-size:1.15rem;color:var(--ink)}
.wait i{display:inline-block;animation:blink 1.2s infinite both;font-style:normal}.wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.stepper{display:flex;align-items:center;gap:.8rem}
.stepper .ink{font-size:1.15rem}
.linkish{font-family:var(--hand);font-size:1rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:.3rem 0}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:2.6rem}
.topbar .vline{height:auto;align-items:center}
.topbar .ib{justify-self:end}
.topbar .linkish{justify-self:start;font-size:.95rem}
.hero{position:relative;text-align:center}
.fan{position:relative;width:100%;cursor:pointer}
.fan .card{position:absolute;left:50%;top:14px;transform-origin:50% 140%}
.fan .card.drop{animation-duration:.55s}
.ttl{margin:calc(var(--lh)*.5) 0 0;font-family:var(--hand);font-weight:700;color:var(--ink);font-size:clamp(3rem,15vw,4.2rem);line-height:calc(var(--lh)*2);letter-spacing:-.01em}
.ttl-u{margin-inline:auto;width:min(100%,17rem);height:14px;margin-top:-2px;color:var(--red)}
.tag3{margin:calc(var(--lh)*.5) 0 0;font-family:var(--hand);font-size:1.5rem;line-height:var(--lh);color:var(--graphite)}
.tag3 span{display:inline-block;margin-right:.45rem}
.tag3 .w3{position:relative;margin-left:.45rem;color:var(--red);font-weight:700}
.tag3 .w3 svg{position:absolute;inset:-8px -12px -6px -10px;width:calc(100% + 22px);height:calc(100% + 14px);color:var(--red);overflow:visible}
.setup{margin-top:calc(var(--lh)*1.5);display:flex;flex-direction:column;gap:calc(var(--lh)*.5)}
.fl{display:flex;flex-direction:column;gap:.2rem}
.fl>.pr{font-weight:500;color:var(--graphite);font-size:.9rem}
.line-in{width:100%;height:calc(var(--lh)*1.5);background:transparent;border:0;border-bottom:1.75px solid var(--ink);
  font-family:var(--hand);font-size:1.5rem;color:var(--ink);padding:0 .1rem;outline:none;border-radius:0}
.line-in::placeholder{color:var(--pencil);opacity:.8}
.line-in:focus-visible{outline:none;border-bottom-width:2.5px}
.err{color:var(--red);font-size:.85rem;min-height:1.2rem;line-height:1.2rem}
.who{font-size:.85rem}
.home .btn.pri{margin-top:calc(var(--lh)*.5);min-height:3.25rem;font-size:1.35rem}
.foot{margin-top:calc(var(--lh)*.25);font-size:.82rem;line-height:1.45;max-width:40ch}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-family:var(--print);font-weight:600}
.code{font:700 1.5rem/1 var(--print);letter-spacing:.25em;color:var(--ink);padding:.3rem .2rem .3rem .5rem;border:1.75px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.lobby{display:flex;flex-direction:column;gap:.35rem;padding-bottom:calc(var(--lh) + env(safe-area-inset-bottom))}
.lrow{display:flex;align-items:center;gap:.6rem;min-height:var(--lh)}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--hand);font-size:1.15rem}
.lrow .nm.me{color:var(--ink);font-weight:700}
.btn.red{color:var(--red);border-color:var(--red)}
.conn{font-weight:600;white-space:nowrap;margin-right:.2rem}

/* game: header */
.hd{display:grid;grid-template-columns:1fr auto auto;align-items:center;column-gap:.4rem;min-height:calc(var(--lh)*2);padding:2px 0;flex:none}
.rd{min-width:0}
.rd .ink{font-size:1.45rem;font-weight:700;line-height:1.1;white-space:nowrap}
.rd .ink .pr{font-size:.78rem;font-weight:400}
.rd .pr{display:block}
.cutb{display:flex;align-items:center;gap:.35rem;padding:0 .2rem}
.cutb .cs{font-size:2.7rem;line-height:1;font-family:var(--print);color:var(--graphite)}
.cutb.r .cs{color:var(--red)}
.cutb .pr{max-width:4.2rem}
.tools{display:flex}

/* ledger */
.lg{flex:none;display:grid;grid-template-columns:1fr;margin-bottom:0}
.lg.two{grid-template-columns:1fr 1fr;column-gap:1.2rem}
.lh{height:var(--lh);display:grid;grid-template-columns:1rem 1.4rem 1fr 6.2rem 2.4rem;align-items:end;padding-bottom:3px;font-size:.7rem;letter-spacing:.02em}
.lh span:last-child,.lr .tt{text-align:right}
.lr{position:relative;height:var(--lh);display:grid;grid-template-columns:1rem 1.4rem 1fr 6.2rem 2.4rem;align-items:center;column-gap:.15rem;min-width:0}
.lg.two .lr{grid-template-columns:.8rem 1.25rem minmax(0,1fr) auto 1.7rem}
.ord{display:inline-flex;align-items:center;justify-content:center;width:1.1rem;height:1.1rem;border-radius:50%;border:1.25px solid var(--pencil);color:var(--pencil);font:600 .66rem/1 var(--print)}
.ord.f{border-color:var(--ink);background:var(--ink);color:var(--page)}
.ord.l{border-color:var(--red);color:var(--red)}
.of .mk{color:var(--ink);font-weight:700}
.of.bust .mk,.of.bust b{color:var(--red)}
.lg.two .lr .of{font-size:1rem}
.lr .arw{width:1rem;height:1rem;color:var(--red);visibility:hidden}
.lr.turn .arw{visibility:visible}
.lr .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--hand);font-size:1.12rem;color:var(--graphite)}
.lr .nm .hlw{padding:0 .15rem;border-radius:3px}
.lr.turn .nm .hlw{background:linear-gradient(100deg,transparent 2%,var(--hl) 6%,var(--hl) 94%,transparent 98%);animation:hl .35s ease-out both}
@keyframes hl{from{background-size:0 100%;background-repeat:no-repeat}to{background-size:100% 100%;background-repeat:no-repeat}}
.lr.me .nm{color:var(--ink);font-weight:700}
.lr .nm i{font-family:var(--print);font-style:normal;font-size:.68rem;color:var(--pencil);margin-left:.3rem}
.lr.away .nm .hlw{opacity:.55}
.lr .nm i.aw{color:var(--red)}
.tl{display:flex;align-items:center;gap:.3rem;min-width:0;justify-content:flex-end}
.tally{height:20px;color:var(--ink);flex:none}
.of{position:relative;font-family:var(--hand);font-size:1.1rem;color:var(--graphite);white-space:nowrap}
.of b{position:relative;display:inline-block;min-width:.8rem;text-align:center;color:var(--ink)}
.of b svg{position:absolute;left:50%;top:50%;width:1.45rem;height:1.5rem;transform:translate(-50%,-52%);color:var(--ink);overflow:visible}
.of.bust b{color:var(--red)} .of.bust b svg{color:var(--red)}
.of.none{color:var(--pencil)}
.lr .tt{font-family:var(--hand);font-size:1.1rem;color:var(--graphite)}
.write{animation:write .5s cubic-bezier(.3,.7,.2,1) both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* pen strokes */
.pen path,.pen line,.pen polyline{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.draw path,.draw line,.draw polyline,path.draw,line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:pen .45s cubic-bezier(.4,.1,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes pen{to{stroke-dashoffset:0}}

/* table */
.table{position:relative;flex:1 1 0;min-height:7rem;padding-top:1.3rem;display:flex;align-items:center;justify-content:center}
.slots{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;row-gap:calc(var(--lh)*.9)}
.slot{position:relative;display:flex;flex-direction:column;align-items:center}
.slot .sn{padding:0 2px;font-family:var(--hand);font-size:.95rem;line-height:1.3;color:var(--graphite);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.2rem}
.slot.me .sn{color:var(--ink);font-weight:700}
.slot.win .sn{color:var(--ink);font-weight:700}
.slot .tg{position:absolute;top:-1.35rem;left:50%;transform:translateX(-50%) rotate(-4deg);font-family:var(--hand);font-size:.9rem;line-height:1.2;white-space:nowrap;color:var(--pencil)}
.slot .tg.cut{color:var(--red);font-weight:700}
.slot .circ{position:absolute;pointer-events:none;color:var(--ink);overflow:visible;z-index:3}
.empty{border:1.5px dashed var(--rule);border-radius:8px}
.empty.now{border-color:var(--ink);border-style:dashed;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{border-color:var(--ink-soft)}}
.calc{text-align:center;padding:0 .3rem}
.calc .big{font-family:var(--hand);font-weight:700;color:var(--ink);font-size:1.6rem;line-height:calc(var(--lh)*1.5)}
.calc .big .cs{font-family:var(--print);font-weight:500}
.calc .big .cs.r{color:var(--red)}
.calc .sum{font-family:var(--hand);font-size:1.25rem;color:var(--graphite);line-height:var(--lh)}
.calc .sum b{color:var(--ink);position:relative}
.calc .left{margin-top:.2rem;font-size:.9rem}
.calc .left.over{color:var(--red)}

/* cards */
.card{position:relative;flex:none;background:var(--card);color:var(--card-ink);border:1px solid var(--card-line);border-radius:7px;box-shadow:var(--shadow);
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--print);font-weight:600;user-select:none;-webkit-user-select:none;transform:rotate(var(--r,0deg))}
.card.rd{color:var(--card-red)}
.card .ci{position:absolute;top:.18em;left:.28em;display:flex;flex-direction:column;align-items:center;line-height:.95;font-size:var(--ix);letter-spacing:-.03em}
.card .ci i{font-style:normal;font-size:.9em}
.card .ci.br{top:auto;left:auto;bottom:.18em;right:.28em;transform:rotate(180deg)}
.card .cc{font-size:var(--cx);line-height:1}
.drop{animation:drop .42s cubic-bezier(.2,.9,.25,1.05) both}
.drop.from-me{--from:150px}
@keyframes drop{from{transform:translateY(var(--from,-60px)) rotate(0) scale(1.08);opacity:0}to{transform:rotate(var(--r,0deg));opacity:1}}

/* status + action */
.stat{flex:none;min-height:var(--lh);display:flex;align-items:center;gap:.4rem;min-width:0;font-family:var(--hand);font-size:1.15rem;color:var(--graphite);line-height:1.2}
.stat.mine{color:var(--ink);font-weight:700}
.stat .sy{font-family:var(--print);font-weight:500}
.stat .sy.r{color:var(--red)}
.hint{flex:none;height:1.1rem;font-size:.75rem;color:var(--pencil);line-height:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{flex:none;height:3px;margin:2px 0 0;background:var(--ink-soft);border-radius:2px;overflow:hidden}
.tm i{display:block;height:100%;background:var(--ink);transform-origin:left;transition:transform .25s linear}
.tm.hot i{background:var(--red)}
.pad{flex:none;padding-bottom:.2rem}
.pad .q{font-family:var(--hand);font-size:1.2rem;font-weight:700;color:var(--ink);line-height:var(--lh)}

.num .sug{position:absolute;inset:3px;color:var(--pencil);pointer-events:none;overflow:visible}

/* hand */

.playbar .btn.pri .sy.r{color:#FFB3AA}
.hand .card{transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .18s,opacity .18s;touch-action:none;cursor:default;transform:none}
.hand .card.ok{transform:translateY(-10px);cursor:grab;border-color:var(--ink)}
.hand .card.sel{transform:translateY(-24px);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink),var(--shadow);z-index:4}

.hand .card .play{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) rotate(-3deg);font-family:var(--hand);font-size:.9rem;font-weight:700;color:var(--ink);white-space:nowrap;pointer-events:none}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,10,20,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out both}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:480px;max-height:92dvh;overflow:auto;background-color:var(--page);
  background-image:linear-gradient(to right,transparent 26px,var(--margin) 26px,var(--margin) 27px,transparent 27px,transparent 30px,var(--margin) 30px,var(--margin) 31px,transparent 31px),linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));
  background-size:100% 100%,100% var(--lh);background-attachment:local;
  padding:calc(var(--lh)*.5) max(16px,env(safe-area-inset-right,0px)) calc(var(--lh)*1 + env(safe-area-inset-bottom)) 40px;border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);
  animation:up .34s cubic-bezier(.2,.85,.25,1) both}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.scrim.noanim,.scrim.noanim .sheet{animation:none}
.sheet.full{height:100dvh;max-height:100dvh;border-radius:0;display:flex;flex-direction:column}
.sh-hd{display:flex;align-items:center;justify-content:space-between;height:calc(var(--lh)*1.5)}
.sh-hd h2{margin:0;font-family:var(--hand);font-weight:700;font-size:1.6rem;color:var(--ink);line-height:1}

.sheet p,.sheet li{font-size:.95rem;line-height:var(--lh);margin:0;max-width:62ch}

.sc-wrap{flex:1 1 auto;min-height:0;overflow:auto;margin:0 -16px 0 -40px;padding:0 16px 0 40px}

.cell{position:relative;display:inline-flex;align-items:baseline;gap:.15rem}

.cell .o{left:50%;top:50%;width:1.9rem;height:1.75rem;transform:translate(-50%,-50%);color:var(--ink)}

.cell .cv{font-weight:400!important;color:var(--pencil)!important}
.cell.miss sup{color:var(--red);font-weight:500}

.sc tfoot th{font-family:var(--print);font-size:.78rem;color:var(--graphite);text-align:left}
.sumline{flex:none;margin-top:.4rem;font-family:var(--hand);font-size:1.15rem;line-height:var(--lh);color:var(--graphite)}
.sumline b{color:var(--ink)}
.sumline .miss{color:var(--red)}
.deal{flex:none;margin-top:.4rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom))}
.insc{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;animation:fade .3s ease-out both}
.insc h2{flex:none;margin:0;height:calc(var(--lh)*1.5);display:flex;align-items:center;gap:.5rem;font-size:1.6rem;font-weight:700}

/* chat */
.msgs{display:flex;flex-direction:column;min-height:calc(var(--lh)*6);max-height:44dvh;overflow:auto;margin:.2rem 0 .4rem}
.msg{font-family:var(--hand);font-size:1.1rem;line-height:var(--lh);color:var(--graphite);overflow-wrap:anywhere}
.msg b{color:var(--ink)}
.msg.mine b{color:var(--red)}

.quick{display:flex;flex-wrap:wrap;gap:.3rem;margin:.2rem 0 .5rem}

/* sticky note for incoming chat */

  padding:.45rem .7rem .5rem;font-family:var(--hand);font-size:1.02rem;line-height:1.3;transform:rotate(2.5deg);box-shadow:0 2px 3px rgba(0,0,0,.12),0 10px 18px rgba(0,0,0,.12);
  animation:stick .35s cubic-bezier(.2,.9,.3,1.2) both;cursor:pointer}
.note-pop b{display:block;font-size:.85rem}
@keyframes stick{from{transform:translateY(-14px) rotate(-4deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-1deg);z-index:60;background:var(--graphite);color:var(--page);padding:.4rem .9rem;border-radius:6px;font-size:.9rem;max-width:90vw;animation:fade .2s both}

/* game over */
.over{flex:none;text-align:center;padding:0 0 calc(var(--lh)*.5)}

.over .stars{position:absolute;inset:-30px -48px;width:calc(100% + 96px);height:calc(100% + 60px);color:var(--red);overflow:visible;pointer-events:none}
.over .rank{margin:calc(var(--lh)*.5) auto 0;max-width:20rem;text-align:left}
.over .rank div{display:flex;justify-content:space-between;height:var(--lh);align-items:center;font-family:var(--hand);font-size:1.25rem}
.over .rank div.me{color:var(--ink);font-weight:700}
.over.btns{flex:none;padding:0;display:flex;gap:.6rem;justify-content:center;margin-top:.5rem}
.over.btns .btn{flex:1}

@media (max-height:760px){
  .home .setup{margin-top:calc(var(--lh)*.6);gap:calc(var(--lh)*.3)}
  .home .btn.pri{margin-top:0;min-height:2.9rem}

}

}
@media (max-height:740px){
  .lg.many .lr,.lg.many .lh{height:calc(var(--lh)*.82)}

}

  .hand{padding-top:1.1rem}
  .nums{grid-template-columns:repeat(auto-fill,minmax(2.4rem,1fr))}.num{height:2.4rem;font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}

(function(){

var FS=[15,16,17.5,19],FSN=['Small','Normal','Large','Larger'];
var FRIEND_LINES=['bold call 👀','who has the ace of cut?','wah, nice hand','I am never calling 0 again','this round is cursed','haha','okay okay','gg'];
var QUICK=['wah!','bold call','oops','gg','😅','👏'];

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:Object.assign({},d,v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function applyUI(){
  var h=document.documentElement;
  if(ui.theme==='auto')h.removeAttribute('data-theme');else h.dataset.theme=ui.theme;
  if(!ui.ink||ui.ink==='blue')h.removeAttribute('data-ink');else h.dataset.ink=ui.ink;
  h.style.fontSize=FS[ui.fs]+'px';
  var bg=getComputedStyle(h).getPropertyValue('--page').trim(),m=document.querySelector('meta[name=theme-color]');

}
function toast(t){var el=$('#toast');el.innerHTML='<div class="toast" role="status">'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){el.innerHTML=''},2400)}

/* ---------- pen marks ---------- */
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%9973;return h}
function rotOf(c){return ((hash(c)%9)-4)*.9}
// a loose hand-drawn loop around a box w x h, overshooting where it closes
function loopPath(w,h,seed){
  var cx=w/2,cy=h/2,rx=w/2,ry=h/2,pts=[],a0=-2.2+(seed%7)*.08,N=46;
  for(var i=0;i<=N;i++){
    var t=i/N,a=a0+t*Math.PI*2.18,wob=1+.035*Math.sin(a*3+seed)+.025*t;
    pts.push((cx+Math.cos(a)*rx*wob).toFixed(1)+','+(cy+Math.sin(a)*ry*wob*(1-.04*t)).toFixed(1));
  }
  return 'M'+pts.join(' L');
}
function loopSVG(w,h,cls,seed,delay){
  return '<svg class="pen '+(cls||'')+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"'+(delay!=null?' style="--d:'+delay+'s"':'')+'><path pathLength="1" d="'+loopPath(w,h,seed||3)+'"/></svg>';
}
function strikeSVG(cls,delay){return '<svg class="pen s '+(cls||'')+'" viewBox="0 0 40 10" preserveAspectRatio="none"'+(delay!=null?' style="--d:'+delay+'s"':'')+'><path pathLength="1" d="M1,7 C12,5 26,4 39,2"/></svg>'}
function tallySVG(m,drawLast){
  if(!m)return '';
  var x=3,h='',w;
  for(var i=0;i<m;i++){
    var inGroup=i%5,cls=(drawLast&&i===m-1)?' class="draw"':'';
    if(inGroup===4){var gx=x-20;h+='<line pathLength="1"'+cls+' x1="'+(gx-1)+'" y1="15" x2="'+(gx+17)+'" y2="5"/>';x+=5}
    else{h+='<line pathLength="1"'+cls+' x1="'+x+'" y1="'+(3+(i%2))+'" x2="'+(x+.6)+'" y2="17"/>';x+=5}
  }
  w=x+1;
  return '<svg class="tally pen" width="'+w+'" height="20" viewBox="0 0 '+w+' 20" aria-hidden="true">'+h+'</svg>';
}
var ICON={
  screen:'<svg viewBox="0 0 24 24" class="pen" aria-hidden="true"><path d="M5 3.5h12.5a1.5 1.5 0 0 1 1.5 1.5v14.5a1 1 0 0 1-1 1H5.5a1.5 1.5 0 0 1-1.5-1.5V4.5a1 1 0 0 1 1-1z"/><path d="M8 3.5v17M4 9h15M4 14h15"/></svg>',
  chat:'<svg viewBox="0 0 24 24" class="pen" aria-hidden="true"><path d="M4.5 5.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H11l-4.5 3.5v-3.5h-2a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></svg>',
  menu:'<svg viewBox="0 0 24 24" class="pen" aria-hidden="true"><path d="M4 7c5-.6 11-.4 16 0M4 12.2c5-.4 11-.2 16 .1M4 17.4c5-.5 10-.3 16 0"/></svg>',
  close:'<svg viewBox="0 0 24 24" class="pen" aria-hidden="true"><path d="M6 6.5c4 3.6 8 7.4 12 11M17.6 6c-3.8 4-7.6 8-11.4 12"/></svg>',
  gear:'<svg viewBox="0 0 24 24" class="pen" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><path d="M15 4.8a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4zM9 14.8a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4z"/></svg>',
  arrow:'<svg viewBox="0 0 16 16" class="pen" aria-hidden="true"><path d="M1.5 8.3c3.8-.2 8-.3 12-.3M9.5 4.2c1.5 1.4 2.8 2.6 4 3.8-1.3 1.3-2.6 2.5-4 3.9"/></svg>'
};

/* ---------- cards ---------- */
function rankL(c){var r=+c.slice(1);return RL[r]||r}
function isRed(s){return s==='H'||s==='D'}
function cardHTML(c,o){
  var s=c[0],L=rankL(c),ix=Math.max(10,Math.min(20,Math.round(o.h*.17))),cx=Math.round(o.h*.36);
  var tag=o.btn?'button':'div';
  return '<'+tag+' class="card'+(isRed(s)?' rd':'')+(o.cls?' '+o.cls:'')+'" style="width:'+o.w+'px;height:'+o.h+'px;--ix:'+ix+'px;--cx:'+cx+'px'+(o.r!=null?';--r:'+o.r.toFixed(1)+'deg':'')+(o.ml?';margin-left:'+o.ml+'px':'')+(o.st||'')+'"'+(o.attrs||'')+' aria-label="'+L+' of '+SN[s]+'">'
    +'<span class="ci" aria-hidden="true">'+L+'<i>'+SY[s]+'</i></span><span class="cc" aria-hidden="true">'+SY[s]+'</span><span class="ci br" aria-hidden="true">'+L+'<i>'+SY[s]+'</i></span>'+(o.inner||'')+'</'+tag+'>';
}

/* ---------- game control ---------- */
var demoT=[];
function clearDemo(){demoT.forEach(clearTimeout);demoT=[]}
function wireLocal(){
  game.onChange=function(){
    game.humans().forEach(function(p){p.connected=(game.phase==='lobby')||p.id===me});
    game.schedule();
    var snp=game.snapshot(me);snp.players.forEach(function(p){p.connected=true});   // demo stand-ins are shown as present
    onSnap(snp);
  };
}
function freshLocal(code){
  if(game)game.destroy();clearDemo();
  isLocal=true;seq=-1;scHidden=false;seenJoin={};
  anim={trick:{},made:{},calls:{},circled:'',rows:{}};sel=null;sheet=null;chatSeen=0;snap=null;
  game=new E.Game(code);game.autoMs=900;
}
function demoCode(){var A='ABCDEFGHJKMNPQRSTUVWXYZ',c='';for(var i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c}
function demoArrive(name,ms){
  demoT.push(setTimeout(function(){
    if(!game||!isLocal||game.phase!=='lobby'||game.humans().length>=8)return;
    var r=game.addHuman(name,'f');if(r.err)return;
    game.pushChat(null,'',game.byId(r.pid).name+' joined the room',true);game.onChange();
    showPop({name:game.byId(r.pid).name,text:'joined the room',pid:r.pid});
  },ms));
}
// Demo, host side: you start a room and friends trickle in
function startDemoRoom(){
  var nm=(setup.name||'').trim();
  freshLocal(demoCode());
  me=game.addHuman(nm,'me').pid;
  game.size=4;game.timerSec=setup.timer;game.botLevel=setup.level;
  wireLocal();game.onChange();
  demoArrive('Atul',1600);demoArrive('Rahul',3300);demoArrive('Priya',5600);
}
// Demo, guest side: you join a room Atul is hosting; he starts it
function demoJoin(code){
  var nm=(setup.name||'').trim();
  freshLocal(code);
  var host=game.addHuman('Atul','f').pid;game.addHuman('Rahul','f');
  me=game.addHuman(nm,'me').pid;
  game.size=5;game.timerSec=setup.timer;game.botLevel=setup.level;
  wireLocal();game.onChange();
  demoArrive('Priya',2500);
  demoT.push(setTimeout(function(){if(game&&game.phase==='lobby')game.act(host,{type:'chat',text:'everyone in? starting in a sec'})},4500));
  demoT.push(setTimeout(function(){if(game&&game.phase==='lobby'){game.act(host,{type:'start'});game.pushChat(null,'','Demo: your friends here are played by the computer',true);game.onChange()}},8000));
}
function startGame(){
  var nm=(setup.name||'').trim();
  if(!nm){errMsg='Write your name on the line first';render();var i=$('#nm');if(i)i.focus();return}
  if(game)game.destroy();clearDemo();
  isLocal=true;seq=-1;scHidden=false;
  anim={trick:{},made:{},calls:{},circled:'',rows:{}};sel=null;sheet=null;chatSeen=0;
  game=new E.Game('DEMO');game.autoMs=900;
  me=game.addHuman(nm,'me').pid;
  game.size=4;game.timerSec=setup.timer;game.botLevel=setup.level;
  game.onChange=function(){
    game.humans().forEach(function(p){p.connected=(game.phase==='lobby')||p.id===me});
    game.schedule();
    var snp=game.snapshot(me);snp.players.forEach(function(p){p.connected=true});   // demo stand-ins are shown as present
    onSnap(snp);
  };
  game.act(me,{type:'start'});
  game.onChange();
}
/* ---------- transport (live rooms; same endpoints and recovery as the previous client) ---------- */
var DEMO=!!window.__DEMO,isLocal=false,es=null,sess=null,pendingKick=null;
try{sess=JSON.parse(localStorage.getItem('jn_sess'))}catch(x){}
function saveSess(v){sess=v;try{localStorage.setItem('jn_sess',JSON.stringify(v))}catch(x){}}
// fetch with a time limit: on flaky mobile networks a request can hang forever otherwise
function fetchT(url,opt,ms){
  opt=opt||{};var ctl=window.AbortController?new AbortController():null,t;
  if(ctl)opt.signal=ctl.signal;

function optimistic(a){
  if(isLocal||!snap||(a.type!=='play'&&a.type!=='call'))return;
  var s=JSON.parse(JSON.stringify(snap)),n=s.players.length,i=-1;
  s.players.forEach(function(p,k){if(p.id===s.me)i=k});
  if(i<0||s.turn!==s.me)return;
  var next=s.players[(i+1)%n].id;
  if(a.type==='play'){
    if(s.phase!=='playing'||s.legal.indexOf(a.card)<0)return;
    s.hand=s.hand.filter(function(c){return c!==a.card});
    if(!s.trick.length)s.led=a.card[0];

    if(sess!==mine)return;   // left the room meanwhile: ignore late replies
    if(r&&r.err){

      if(r.err==='Not your turn'||r.err==='Not now'){resync();return}

}

function tableLayout(n,W,avail){
  function need(rows,th){return rows*(th+26)+(rows-1)*26}
  var best=null;
  [1,2,3].forEach(function(rows){
    var per=Math.ceil(n/rows);if(rows>1&&per<2)return;
    var byH=Math.floor(((avail-(rows-1)*26-20)/rows-26)/1.4);
    var tw=Math.min(86,Math.floor((W-8)/per)-10,byH),th=Math.round(tw*1.4);
    if(tw<30||need(rows,th)>avail)return;
    if(!best||tw>best.tw)best={rows:rows,per:per,tw:tw,th:th};
  });
  // nothing fits comfortably: shrink the cards to what the height really allows (down to 20px wide)
  if(!best){var rows=n>4?2:1,per=Math.ceil(n/rows);var byH2=Math.floor(((avail-(rows-1)*26-4)/rows-24)/1.4);var tw=Math.max(20,Math.min(Math.floor((W-8)/per)-10,byH2,40));best={rows:rows,per:per,tw:tw,th:Math.round(tw*1.4)}}
  return best;
}

function rulesHTML(){
  return '<h3>The idea</h3><p>Before each round, call how many hands you will win. Make exactly that many to score. One more or one less and the round scores nothing.</p>'
  +'<h3>Rounds</h3><ul><li>3 to 8 players. The deck is dealt out evenly; leftover cards are set aside.</li><li>Round 1 has the most cards. Each round deals one fewer, down to one card.</li></ul>'
  +'<h3>Calling</h3><ul><li>Calls go round the table, and you see every call before yours.</li><li>Any number is allowed, 0 included. The last caller can’t make the calls add up to the cards in the round.</li></ul>'
  +'<h3>Playing a hand</h3><ul><li>Flick a card up to play it, or tap a card to pick it and press Play. Tap it again to put it back.</li><li>Follow the led suit if you can. Ace is high. The highest card of the led suit wins the hand, and the winner leads next.</li></ul>'
  +'<h3>The cut</h3><ul><li>The cut suit rotates: Spades, Hearts, Clubs, Diamonds, then no cut.</li><li>With none of the led suit, play anything. A cut card beats the led suit; a higher cut beats a lower one.</li></ul>'
  +'<h3>Scoring</h3><ul><li>Make your call exactly: 10 plus your call. Call 0 and win nothing: 10.</li><li>Miss: 0. On the Screen, a made call shows its points in bold; a missed call is struck out with the hands actually made beside it.</li></ul>';
}
function renderOver(){
  if(!snap||snap.phase!=='gameover'||sheet)return;
  var s=snap,order=s.players.slice().sort(function(a,b){return b.score-a.score});
  var names=s.winners.map(function(id){return id===s.me?'You':nameOf(id)});
  var title=names.length>1?esc(names.join(' & '))+' tie!':(names[0]==='You'?'You win!':esc(names[0])+' wins');
  var stars='<svg class="stars pen draw" viewBox="0 0 300 160" preserveAspectRatio="none" aria-hidden="true">'
    +['M22,40 l6,14 l15,1 l-12,9 l4,15 l-13,-8 l-13,8 l4,-15 l-12,-9 l15,-1 z','M262,22 l5,11 l12,1 l-9,7 l3,12 l-11,-7 l-10,7 l3,-12 l-9,-7 l12,-1 z','M276,112 l4,9 l10,1 l-8,6 l3,10 l-9,-6 l-8,6 l3,-10 l-8,-6 l10,-1 z'].map(function(d,i){return '<path pathLength="1" style="--d:'+(1+i*.25)+'s" d="'+d+'"/>'}).join('')+'</svg>';
  var h='<div class="scrim"><section class="sheet full" role="dialog" aria-label="Game over">'
   +'<div class="over"><div class="wn">'+title+stars+'<svg class="u pen draw" viewBox="0 0 200 18" preserveAspectRatio="none" style="--d:.5s" aria-hidden="true"><path pathLength="1" d="M4,7 C60,3 140,3 196,6"/><path pathLength="1" style="--d:.8s" d="M10,14 C70,10 130,11 190,12"/></svg></div>'
   +'<div class="rank">'+order.map(function(p,i){return '<div class="'+(p.id===s.me?'me':'')+'"><span>'+(i+1)+'. '+esc(p.id===s.me?'You':p.name)+'</span><span>'+p.score+'</span></div>'}).join('')+'</div>'
   +'</div><div class="over-sc">'+screenHTML()+'</div>'
   +'<div class="over btns"><button class="btn" data-a="home">Leave</button>'+(s.host===s.me||(isLocal&&game&&game.code==='DEMO')?'<button class="btn pri" data-a="again">Play again</button>':'<span class="pr" style="align-self:center">Waiting for the host</span>')+'</div>'
   +'</section></div>';
  $('#sheet').innerHTML=h;
}

/* ---------- main render ---------- */
function render(){
  if(!snap)renderHome();else if(snap.phase==='lobby')renderLobby();else renderGame();
  if(sheet!=='rules')renderSheet();renderOver();paintConn();
}

/* ---------- input ---------- */
function playCard(c){sel=null;act({type:'play',card:c})}
function tapCard(c){sel=(sel===c)?null:c;render()}
var drag=null;
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.hand .card.ok');if(!el)return;
  drag={el:el,c:el.dataset.c,x0:e.clientX,y0:e.clientY,dy:0,moved:false,id:e.pointerId,pts:[{y:e.clientY,t:e.timeStamp}]};
  try{el.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dy=e.clientY-drag.y0,dx=e.clientX-drag.x0;
  if(!drag.moved&&Math.abs(dy)<6&&Math.abs(dx)<6)return;
  drag.moved=true;drag.dy=dy;drag.pts.push({y:e.clientY,t:e.timeStamp});if(drag.pts.length>8)drag.pts.shift();
  drag.el.classList.add('dragging');
  drag.el.style.transform='translate('+dx+'px,'+(Math.min(0,dy)-10)+'px) rotate('+(dx*.05)+'deg)';
});
document.addEventListener('pointerup',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var d=drag;drag=null;
  if(!d.moved){tapCard(d.c);return}
  var p0=d.pts.filter(function(p){return e.timeStamp-p.t<=90})[0]||d.pts[0],vy=(e.clientY-p0.y)/Math.max(1,e.timeStamp-p0.t);
  if(d.dy<-50||(d.dy<-14&&vy<-.5))playCard(d.c);
  else{d.el.classList.remove('dragging');d.el.style.transform=''}
});
document.addEventListener('pointercancel',function(){if(drag){drag.el.classList.remove('dragging');drag.el.style.transform='';drag=null}});
document.addEventListener('click',function(e){
  // keyboard activation of hand cards (pointer taps are handled above)
  var hc=e.target.closest('.hand .card.ok');
  if(hc){if(e.detail===0)tapCard(hc.dataset.c);return}
  var t=e.target.closest('[data-a]');
  if(!t)return;
  if(t.classList.contains('scrim')&&e.target!==t)return;
  var a=t.dataset.a,v=t.dataset.v;
  switch(a){
    case 'start':create();break;
    case 'join':join();break;
    case 'lstart':act({type:'start'});break;
    case 'lsize':act({type:'size',size:snap.n+(+t.dataset.d)});setTimeout(renderSheet,60);break;
    case 'copy':{if(isLocal){toast('Demo room: in the live app this copies an invite link');break}var link=location.origin+location.pathname+'?room='+snap.code;try{navigator.clipboard.writeText(link).then(function(){toast('Invite link copied')},function(){toast(link)})}catch(x){toast(link)}break}
    case 'kickask':pendingKick=+t.dataset.p;render();break;
    case 'kickno':pendingKick=null;render();break;
    case 'kickyes':act({type:'kick',pid:+t.dataset.p});pendingKick=null;render();toast('Player removed');break;
    case 'rename':{var rv=($('#rn')||{}).value;rv=(rv||'').trim();if(!rv){toast('Write a name first');break}setup.name=rv;save('jn_setup',setup);act({type:'rename',name:rv});toast('Name saved');break}
    case 'redeal':{var nmv=($('#nm')||{}).value;firstHome=true;render();if(nmv!=null&&$('#nm'))$('#nm').value=nmv;break}
    case 'hidesc':scHidden=true;render();break;
    case 'showsc':scHidden=false;render();break;
    case 'size':setup.size=+v;keepName();save('jn_setup',setup);render();break;
    case 'level':setup.level=v;keepName();save('jn_setup',setup);render();break;
    case 'timer':setup.timer=+v;keepName();save('jn_setup',setup);render();break;
    case 'call':act({type:'call',n:+t.dataset.n});break;
    case 'nope':toast('Calls can’t add up to '+snap.round.cards+', so pick another number');break;
    case 'screen':sheet='screen';$('#sheet').innerHTML='';renderSheet();break;
    case 'chat':sheet='chat';chatSeen=lastId(snap);$('#pop').innerHTML='';render();var ci=$('#cin');if(ci&&matchMedia('(pointer:fine)').matches)ci.focus();break;
    case 'settings':case 'menu':case 'table':sheet='settings';pendingKick=null;renderSheet();break;
    case 'ink':ui.ink=v;applyUI();renderSheet();break;
    case 'autostart':create(true);break;
    case 'submit':if(sel)playCard(sel);break;
    case 'rules':sheet='rules';renderSheet();break;
    case 'close':sheet=null;render();break;
    case 'next':scHidden=false;act({type:'next'});break;
    case 'quick':sendChat(v);break;
    case 'theme':ui.theme=v;applyUI();renderSheet();break;
    case 'fs':ui.fs=+v;applyUI();render();
if(sess&&!DEMO)tryRejoin();break;
    case 'glevel':act({type:'level',level:v});setTimeout(renderSheet,60);break;
    case 'gtimer':act({type:'timer',sec:+v});setTimeout(renderSheet,60);break;
    case 'again':sheet=null;if(isLocal&&game&&game.code==='DEMO')startGame();else act({type:'again'});break;
    case 'home':leave();break;
  }
});
function keepName(){var i=$('#nm');if(i)setup.name=i.value.trim()}
function sendChat(text){
  text=String(text||'').trim();if(!text||!snap)return;
  if(isLocal&&game){var p=game.byId(me);if(p)p.lastChat=0}
  act({type:'chat',text:text});
  if(isLocal&&Math.random()<.7)friendSays(null,1300);
}
document.addEventListener('submit',function(e){
  if(e.target.id!=='cform')return;e.preventDefault();
  var i=$('#cin'),v=i.value;i.value='';sendChat(v);setTimeout(function(){var j=$('#cin');if(j)j.focus()},0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='nm'){e.preventDefault();create()}
  if(e.key==='Enter'&&e.target.id==='rc'){e.preventDefault();join()}
  if(e.key==='Escape'&&sheet){sheet=null;render()}
});
var rsT=null;
// On phones the on-screen keyboard shrinks the window height. Redrawing then would replace the text box
// being typed in and close the keyboard, so only redraw when the width changes (rotation, desktop resize),
// or on a height change while nothing is being typed.
var lastW=innerWidth;
function typing(){var a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')}
addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){
  var widthChanged=innerWidth!==lastW;lastW=innerWidth;
  if(!widthChanged&&typing())return;
  if(snap)render();else{var nm=$('#nm'),v=nm&&nm.value,rc=$('#rc'),rv=rc&&rc.value;homeFw=null;renderHome();if(v!=null&&$('#nm'))$('#nm').value=v;if(rv!=null&&$('#rc'))$('#rc').value=rv}
},120)});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyUI);

applyUI();render();
if(sess&&!DEMO)tryRejoin();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(snap)render()});
window.__jn={get snap(){return snap},game:function(){return game},st:function(){return{seq:seq,conn:conn,poll:!!pollT}},act:act,wake:wake};
})();
</script>
</body>
</html>
